<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iEnergizer – Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-1:        #0e0e10;
      --accent:      #7c6dfa;
      --accent-tint: #1e1a3a;
      --text-heading:#f0f0f0;
      --text-body:   #9090a0;
      --text-muted:  #55555f;
      --border:      #2a2a30;
      --border-dark: rgba(255,255,255,.06);
      --ease:        cubic-bezier(.4,0,.2,1);
    }

    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      font-family: "DM Sans", sans-serif;
      background: var(--bg-1);
      color: var(--text-body);
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════
       HERO
    ═══════════════════════════════════ */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
      align-items: center;
      position: relative;
      overflow: hidden;
      background: var(--bg-1);
      padding: clamp(1.5rem, 4vw, 3rem) clamp(1.25rem, 5vw, 4rem);
    }

    .hero-bg {
      position: absolute; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 60% at 75% 50%, rgba(124,109,250,.13) 0%, transparent 65%),
        radial-gradient(ellipse 30% 30% at 10% 80%, rgba(124,109,250,.05) 0%, transparent 60%);
    }

    .hero-grid-lines {
      position: absolute; inset: 0; z-index: 0;
      background-image:
        linear-gradient(var(--border-dark) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-dark) 1px, transparent 1px);
      background-size: clamp(40px, 8vw, 68px) clamp(40px, 8vw, 68px);
      -webkit-mask-image: radial-gradient(ellipse 85% 75% at 50% 50%, black 15%, transparent 75%);
      mask-image:         radial-gradient(ellipse 85% 75% at 50% 50%, black 15%, transparent 75%);
    }

    /* ── LEFT ── */
    .hero-left {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 100%;
      padding: clamp(1rem, 3vw, 2rem) 0;
    }

    .hero-eyebrow {
      display: inline-flex; 
      align-items: center; 
      gap: clamp(0.4rem, 1.2vw, 0.65rem);
      font-size: clamp(0.55rem, 1.4vw, 0.7rem); 
      font-weight: 500; 
      letter-spacing: clamp(0.15em, 0.5vw, 0.24em);
      text-transform: uppercase; 
      color: var(--accent);
      margin-bottom: clamp(1.2rem, 3vw, 2rem);
      opacity: 0; 
      transform: translateY(18px);
      animation: fadeUp .6s .08s var(--ease) forwards;
    }
    .hero-eyebrow::before {
      content: ""; 
      display: block;
      width: clamp(16px, 4vw, 26px); 
      height: 1px; 
      background: var(--accent);
    }

    .hero-title {
      font-size: clamp(2.2rem, 8vw, 5.6rem);
      font-weight: 300; 
      line-height: 1.08;
      color: var(--text-heading); 
      letter-spacing: -0.02em;
      margin-bottom: clamp(1.5rem, 4vw, 2.8rem);
      opacity: 0; 
      transform: translateY(28px);
      animation: fadeUp .75s .2s var(--ease) forwards;
      word-wrap: break-word;
      max-width: 100%;
    }
    .hero-title em { 
      font-style: italic; 
      color: var(--accent); 
      font-weight: 300; 
    }
    .hero-title strong { 
      font-weight: 600; 
      display: block; 
    }

    .hero-cta {
      display: flex; 
      gap: clamp(0.75rem, 2vw, 1.25rem); 
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp .6s .42s var(--ease) forwards;
    }

    .btn-primary {
      display: inline-flex; 
      align-items: center; 
      gap: clamp(0.5rem, 1.5vw, 0.8rem);
      background: var(--accent); 
      color: #fff;
      padding: clamp(0.7rem, 2vw, 1rem) clamp(1.25rem, 3.5vw, 2rem); 
      border-radius: 40px;
      font-size: clamp(0.7rem, 1.6vw, 0.82rem); 
      font-weight: 500; 
      letter-spacing: 0.08em;
      text-transform: uppercase; 
      text-decoration: none; 
      border: none; 
      cursor: pointer;
      transition: transform .22s, box-shadow .22s;
      white-space: nowrap;
    }
    .btn-primary:hover { 
      transform: scale(.97); 
      box-shadow: 0 14px 36px rgba(124,109,250,.38); 
    }
    .btn-primary:active { 
      transform: scale(.94); 
    }

    .btn-ghost {
      display: inline-flex; 
      align-items: center; 
      gap: clamp(0.5rem, 1.5vw, 0.8rem);
      background: transparent; 
      color: var(--text-heading);
      padding: clamp(0.7rem, 2vw, 1rem) clamp(1.25rem, 3.5vw, 2rem); 
      border-radius: 40px;
      font-size: clamp(0.7rem, 1.6vw, 0.82rem); 
      font-weight: 500; 
      letter-spacing: 0.08em;
      text-transform: uppercase; 
      text-decoration: none;
      border: 1px solid var(--border); 
      cursor: pointer;
      transition: transform .22s, border-color .22s, color .22s;
      white-space: nowrap;
    }
    .btn-ghost:hover { 
      border-color: var(--accent); 
      color: var(--accent); 
      transform: scale(.97); 
    }
    .btn-ghost:active { 
      transform: scale(.94); 
    }

    /* Button icon sizing */
    .btn-primary svg,
    .btn-ghost svg {
      width: clamp(10px, 2.5vw, 13px);
      height: clamp(10px, 2.5vw, 13px);
    }

    /* ── RIGHT: canvas ── */
    .hero-right {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      height: 100%;
      width: 100%;
    }

    #heroCanvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 50vh;
    }

    /* scroll hint */
    .hero-scroll-hint {
      position: absolute; 
      bottom: clamp(1.2rem, 3vw, 2rem); 
      left: 50%; 
      transform: translateX(-50%);
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 0.4rem;
      font-size: clamp(0.55rem, 1.3vw, 0.65rem); 
      letter-spacing: 0.12em; 
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0; 
      animation: fadeUp .5s 1s ease forwards;
      z-index: 3;
    }
    .scroll-dot {
      width: 1px; 
      height: clamp(28px, 6vw, 40px);
      background: linear-gradient(var(--border), transparent);
      animation: scrollPulse 2s infinite;
    }
    @keyframes scrollPulse { 
      0%, 100% { opacity: .2; } 
      50% { opacity: 1; } 
    }

    /* ═══════════════════════════════════
       RESPONSIVE BREAKPOINTS
    ═══════════════════════════════════ */
    
    /* Small mobile: 320px - 480px */
    @media (max-width: 480px) {
      .hero {
        padding: 1.25rem 1rem;
        gap: 2rem;
      }
      
      .hero-left {
        padding: 0.5rem 0;
      }
      
      .hero-title {
        line-height: 1.12;
        margin-bottom: 1.5rem;
      }
      
      .hero-cta {
        flex-direction: column;
        width: 100%;
      }
      
      .btn-primary,
      .btn-ghost {
        width: 100%;
        justify-content: center;
      }
      
      .hero-right {
        min-height: 40vh;
      }
      
      #heroCanvas {
        min-height: 40vh;
      }
    }

    /* Mobile landscape / Tablet portrait: 481px - 859px */
    @media (min-width: 481px) and (max-width: 859px) {
      .hero {
        padding: 2rem 1.5rem;
        gap: 2.5rem;
      }
      
      .hero-left {
        padding: 1rem 0;
      }
      
      .hero-right {
        min-height: 45vh;
      }
      
      #heroCanvas {
        min-height: 45vh;
      }
    }

    /* Mobile - Stack layout */
    @media (max-width: 859px) {
      .hero {
        grid-template-columns: 1fr;
      }
      
      .hero-right {
        order: -1;
      }
      
      .hero-title br {
        display: inline;
      }
      
      .hero-title br::after {
        content: " ";
      }
    }

    /* Tablet landscape / Small desktop: 860px - 1024px */
    @media (min-width: 860px) {
      .hero {
        grid-template-columns: 1fr 1fr;
        gap: clamp(2rem, 4vw, 4rem);
        padding: 3rem clamp(2rem, 5vw, 4rem);
      }
      
      .hero-left {
        max-width: 560px;
        padding: 2rem 0;
      }
      
      .hero-right {
        min-height: 100vh;
        height: 100%;
      }
      
      #heroCanvas {
        min-height: 100vh;
        height: 100%;
      }
    }

    /* Medium desktop: 1025px - 1440px */
    @media (min-width: 1025px) and (max-width: 1440px) {
      .hero {
        gap: 3rem;
      }
      
      .hero-left {
        max-width: 600px;
      }
    }

    /* Large desktop: 1441px+ */
    @media (min-width: 1441px) {
      .hero {
        gap: 4rem;
        padding: 3rem 6vw;
      }
      
      .hero-left {
        max-width: 640px;
      }
      
      .hero-title {
        font-size: 5.8rem;
      }
    }

    /* Ultra-wide: 1920px+ */
    @media (min-width: 1920px) {
      .hero {
        padding: 4rem 8vw;
        gap: 5rem;
      }
      
      .hero-left {
        max-width: 700px;
      }
    }

    /* Landscape orientation optimization for mobile */
    @media (max-width: 859px) and (orientation: landscape) {
      .hero {
        min-height: fit-content;
        padding: 2rem 1.5rem;
      }
      
      .hero-right {
        min-height: 60vh;
      }
      
      #heroCanvas {
        min-height: 60vh;
      }
      
      .hero-scroll-hint {
        display: none;
      }
    }

    /* Touch device optimizations */
    @media (hover: none) and (pointer: coarse) {
      .btn-primary:hover,
      .btn-ghost:hover {
        transform: none;
      }
      
      .btn-primary:active {
        transform: scale(.94);
      }
      
      .btn-ghost:active {
        transform: scale(.94);
        border-color: var(--accent);
        color: var(--accent);
      }
    }

    /* High DPI displays */
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      .hero-grid-lines {
        background-size: clamp(50px, 8vw, 68px) clamp(50px, 8vw, 68px);
      }
    }

    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      
      html {
        scroll-behavior: auto;
      }
    }

    @keyframes fadeUp { 
      to { 
        opacity: 1; 
        transform: translateY(0); 
      } 
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-bg"></div>
  <div class="hero-grid-lines"></div>

  <!-- LEFT -->
  <div class="hero-left">
    <div class="hero-eyebrow">Business Process Excellence</div>
    <h1 class="hero-title">
      Powering<br>
      <em>Exceptional</em><br>
      <strong>Experiences.</strong>
    </h1>
    <div class="hero-cta">
      <a href="#services" class="btn-primary">
        Explore Services
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </a>
      <a href="#contact" class="btn-ghost">Speak to an Expert</a>
    </div>
  </div>

  <!-- RIGHT: Orb canvas with scatter effect -->
  <div class="hero-right">
    <canvas id="heroCanvas"></canvas>
  </div>

  <div class="hero-scroll-hint">
    <span>Scroll</span>
    <div class="scroll-dot"></div>
  </div>
</section>

<script>
(function () {
  const canvas    = document.getElementById('heroCanvas');
  const heroRight = canvas.parentElement;
  const ctx       = canvas.getContext('2d');

  /* ── Palette ── */
  const COLORS = [
    '#7c6dfa', '#9d91fc', '#5a4fe0',
    '#c084fc', '#a78bfa', '#6366f1',
    '#818cf8', '#4f46e5', '#e879f9',
  ];

  let W, H, dpr;
  let particles  = [];
  let resizeTimer;

  /* orb bounce state */
  let orbX, orbY;
  let orbVX, orbVY;
  const ORB_SPEED   = 1.4;

  /* rotation */
  let rotX = 0, rotY = 0;
  const ROT_SPEED_X = 0.004;
  const ROT_SPEED_Y = 0.007;

  /* mouse scatter effect */
  let mouse = { x: -9999, y: -9999 };
  let isHovering = false;
  let MOUSE_SCATTER_R = 120;
  const SCATTER_FORCE = 18;

  /* ── Resize ── */
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W   = heroRight.offsetWidth  || window.innerWidth;
    H   = heroRight.offsetHeight || window.innerHeight * 0.6;

    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);

    /* Adjust scatter radius based on screen size */
    MOUSE_SCATTER_R = Math.min(W, H) * 0.15;

    /* init orb position at centre */
    if (!orbX) {
      orbX = W / 2;
      orbY = H / 2;
      const angle = Math.random() * Math.PI * 2;
      orbVX = Math.cos(angle) * ORB_SPEED;
      orbVY = Math.sin(angle) * ORB_SPEED;
    }

    buildParticles();
  }

  /* ── Compute orb radius from canvas size ── */
  function getOrbR() {
    return Math.min(W, H) * 0.28;
  }

  /* ── Spherical particle system with scatter physics ── */
  function buildParticles() {
    const COUNT = Math.min(1800, Math.floor((W * H) / 200));
    const R     = getOrbR();
    particles   = [];

    for (let i = 0; i < COUNT; i++) {
      const phi   = Math.acos(1 - 2 * (i + 0.5) / COUNT);
      const theta = Math.PI * (1 + Math.sqrt(5)) * i;

      const x3 = Math.sin(phi) * Math.cos(theta);
      const y3 = Math.sin(phi) * Math.sin(theta);
      const z3 = Math.cos(phi);

      const layer = Math.random() < 0.15 ? (0.4 + Math.random() * 0.4) : 1.0;

      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      const size  = layer * (Math.random() * 1.6 + 0.4);
      const alpha = layer * (0.5 + Math.random() * 0.5);

      particles.push({ 
        x3, y3, z3, 
        layer, 
        color, 
        size, 
        baseAlpha: alpha,
        offsetX: 0,
        offsetY: 0,
        vx: 0,
        vy: 0
      });
    }

    /* extra inner-glow core particles */
    const coreCount = Math.min(200, Math.floor(COUNT * 0.15));
    for (let i = 0; i < coreCount; i++) {
      const phi   = Math.random() * Math.PI;
      const theta = Math.random() * Math.PI * 2;
      const r     = 0.1 + Math.random() * 0.3;
      particles.push({
        x3: r * Math.sin(phi) * Math.cos(theta),
        y3: r * Math.sin(phi) * Math.sin(theta),
        z3: r * Math.cos(phi),
        layer: 0.3,
        color: '#ffffff',
        size: Math.random() * 0.8 + 0.2,
        baseAlpha: 0.25 + Math.random() * 0.35,
        offsetX: 0,
        offsetY: 0,
        vx: 0,
        vy: 0
      });
    }
  }

  /* ── Rotate a 3D point around X and Y axes ── */
  function rotate(x3, y3, z3, rx, ry) {
    const cosY = Math.cos(ry), sinY = Math.sin(ry);
    const x1 = x3 * cosY + z3 * sinY;
    const z1 = -x3 * sinY + z3 * cosY;

    const cosX = Math.cos(rx), sinX = Math.sin(rx);
    const y1 = y3 * cosX - z1 * sinX;
    const z2 = y3 * sinX + z1 * cosX;

    return { x: x1, y: y1, z: z2 };
  }

  /* ── Update particle scatter physics ── */
  function updateParticleScatter(p, baseX, baseY) {
    const RETURN_SPEED = 0.08;
    const FRICTION     = 0.85;

    const currentX = baseX + p.offsetX;
    const currentY = baseY + p.offsetY;
    const dx   = currentX - mouse.x;
    const dy   = currentY - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (isHovering && dist < MOUSE_SCATTER_R && dist > 0) {
      const force = (MOUSE_SCATTER_R - dist) / MOUSE_SCATTER_R;
      const angle = Math.atan2(dy, dx);
      p.vx += Math.cos(angle) * force * SCATTER_FORCE;
      p.vy += Math.sin(angle) * force * SCATTER_FORCE;
    } else {
      p.vx += (0 - p.offsetX) * RETURN_SPEED;
      p.vy += (0 - p.offsetY) * RETURN_SPEED;
    }

    p.vx *= FRICTION;
    p.vy *= FRICTION;
    p.offsetX += p.vx;
    p.offsetY += p.vy;
  }

  /* ── Draw glow halo behind orb ── */
  function drawHalo(cx, cy, R) {
    const g = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.6);
    g.addColorStop(0,   'rgba(124,109,250,0.18)');
    g.addColorStop(0.5, 'rgba(124,109,250,0.07)');
    g.addColorStop(1,   'rgba(124,109,250,0.00)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.6, 0, Math.PI * 2);
    ctx.fill();
  }

  /* ── Draw orb with scatter effect ── */
  function drawOrb(cx, cy) {
    const R = getOrbR();

    drawHalo(cx, cy, R);

    const projected = particles.map(p => {
      const { x, y, z } = rotate(p.x3, p.y3, p.z3, rotX, rotY);
      const perspective = 2.2 / (2.2 - z * 0.5);
      const baseX = cx + x * R * perspective;
      const baseY = cy + y * R * perspective;
      
      updateParticleScatter(p, baseX, baseY);
      
      const px = baseX + p.offsetX;
      const py = baseY + p.offsetY;
      const pz = z;
      
      const depthAlpha = 0.3 + (pz + 1) * 0.35;
      return { 
        px, py, pz, 
        size: p.size * perspective, 
        color: p.color, 
        alpha: p.baseAlpha * depthAlpha 
      };
    });

    projected.sort((a, b) => a.pz - b.pz);

    projected.forEach(p => {
      ctx.globalAlpha = Math.min(p.alpha, 1);
      ctx.fillStyle   = p.color;
      ctx.beginPath();
      ctx.arc(p.px, p.py, Math.max(p.size, 0.3), 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.globalAlpha = 1;
  }

  /* ── Bounce orb off walls ── */
  function bounceOrb() {
    const R = getOrbR();

    if (isHovering) {
      const dx   = orbX - mouse.x;
      const dy   = orbY - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < R * 1.5 && dist > 0) {
        const force = (R * 1.5 - dist) / (R * 1.5);
        orbVX += (dx / dist) * force * 0.5;
        orbVY += (dy / dist) * force * 0.5;
      }
    }

    const speed = Math.sqrt(orbVX * orbVX + orbVY * orbVY);
    const maxSpeed = ORB_SPEED * 3;
    if (speed > maxSpeed) {
      orbVX = (orbVX / speed) * maxSpeed;
      orbVY = (orbVY / speed) * maxSpeed;
    }

    if (speed > ORB_SPEED) {
      orbVX *= 0.992;
      orbVY *= 0.992;
    }

    orbX += orbVX;
    orbY += orbVY;

    const margin = R * 0.85;
    if (orbX - margin < 0)    { orbX = margin;      orbVX = Math.abs(orbVX); }
    if (orbX + margin > W)    { orbX = W - margin;  orbVX = -Math.abs(orbVX); }
    if (orbY - margin < 0)    { orbY = margin;      orbVY = Math.abs(orbVY); }
    if (orbY + margin > H)    { orbY = H - margin;  orbVY = -Math.abs(orbVY); }
  }

  /* ── Animation loop ── */
  function tick() {
    ctx.clearRect(0, 0, W, H);

    rotX += ROT_SPEED_X;
    rotY += ROT_SPEED_Y;

    bounceOrb();
    drawOrb(orbX, orbY);

    requestAnimationFrame(tick);
  }

  /* ── Mouse / touch ── */
  function toLocal(cx, cy) {
    const r = canvas.getBoundingClientRect();
    return { x: cx - r.left, y: cy - r.top };
  }

  canvas.addEventListener('mousemove', e => {
    const p = toLocal(e.clientX, e.clientY);
    mouse.x = p.x; mouse.y = p.y; isHovering = true;
  });
  canvas.addEventListener('mouseleave', () => {
    isHovering = false; mouse.x = -9999; mouse.y = -9999;
  });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    const p = toLocal(t.clientX, t.clientY);
    mouse.x = p.x; mouse.y = p.y; isHovering = true;
  }, { passive: false });
  canvas.addEventListener('touchend', () => {
    isHovering = false; mouse.x = -9999; mouse.y = -9999;
  });

  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 160);
  });

  /* ── Init ── */
  requestAnimationFrame(() => {
    resize();
    tick();
  });

})();
</script>

</body>
</html>

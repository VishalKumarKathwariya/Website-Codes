<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jello – Variable Font Drag</title>
<style>
@font-face {
  font-family: 'GT-Flexa';
  src: url('https://assets.codepen.io/61488/GT-Flexa-VF-Trial.woff2') format('woff2');
  font-display: block;
  font-style: normal;
  font-weight: 100 800;
  font-stretch: 10% 200%;
}

:root {
  --fw:       600;
  --fs:       150;
  --fontSize: 18;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #FF7F99;
  font-family: 'GT-Flexa', sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;

  /* hand cursor */
  cursor: url("data:image/svg+xml,%3Csvg width='64px' height='64px' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 700'%3E%3Cpath d='M419.99,560.0013c83.627,0,151.67-68.041,151.67-151.67v-198.33A46.6565,46.6565,0,0,0,499.047,171.22a46.6714,46.6714,0,0,0-70-23.3323,46.7853,46.7853,0,0,0-44.055-31.219,46.2641,46.2641,0,0,0-23.332,6.2773V46.669a46.668,46.668,0,1,0-93.336,0v272.79l-64.145-32.082a70.2983,70.2983,0,0,0-31.289-7.375,44.6638,44.6638,0,0,0-31.5,76.23l150.88,150.87A179.4167,179.4167,0,0,0,420,560ZM172.9,303.33a21.3182,21.3182,0,0,0-15.0035,36.379l150.9,150.88a156.058,156.058,0,0,0,111.18,46.082c70.77,0,128.36-57.562,128.36-128.33V210.001a23.332,23.332,0,1,0-46.664,0v58.332a11.668,11.668,0,0,1-23.336,0V186.669a23.332,23.332,0,1,0-46.664,0v81.668a11.668,11.668,0,0,1-23.336,0v-105a23.332,23.332,0,0,0-46.664,0v105a11.668,11.668,0,0,1-23.336,0V46.677a23.332,23.332,0,0,0-46.664,0v291.67a11.66,11.66,0,0,1-16.8712,10.43l-81.035-40.508a46.9273,46.9273,0,0,0-20.863-4.9258Z' fill='%23fff'/%3E%3C/svg%3E") 32 32, pointer;
}

/* Grab cursor while dragging */
body.grabbing {
  cursor: url("data:image/svg+xml,%3Csvg width='64px' height='64px' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 700'%3E%3Cpath d='M419.9949,560.0013a179.4167,179.4167,0,0,1-127.73-52.898l-46.691-46.668a81.2138,81.2138,0,0,1-23.914-57.77v-35.352a81.1643,81.1643,0,0,1,23.918-57.75l22.75-22.723v-53.504a46.6566,46.6566,0,0,1,72.613-38.7813,46.691,46.691,0,0,1,88.106,0,46.6714,46.6714,0,0,1,70,23.3323,46.6566,46.6566,0,0,1,72.613,38.7813v151.67c0,83.625-68.039,151.66-151.67,151.66Z' fill='%23fff'/%3E%3C/svg%3E") 32 32, pointer;
}

/* ── Hint ── */
.hint {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: white;
  opacity: 0.4;
  font-family: 'Courier New', monospace;
  pointer-events: none;
  white-space: nowrap;
}

/* ── Stage ── */
.stage {
  position: relative;
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  visibility: hidden; /* revealed by GSAP */
}

.content {
  text-align: center;
  -webkit-user-select: none;
  user-select: none;
}

/* ── Text ── */
.txt {
  margin: 0;
  font-size: calc(var(--fontSize) * 1vw);
  font-weight: var(--fw);
  font-stretch: calc(var(--fs) * 1%);
  line-height: 0.65;
  letter-spacing: -1vw;
  color: white;
  text-shadow:
    0 0.05em 0  #FFB0C0,
    0 0.1em 0.1em rgba(70,0,35,0.3),
    0 0.4em 0.3em rgba(70,0,35,0.1);
}

/* Individual chars injected by JS */
.char {
  display: inline-block;
  position: relative;
  padding-top: 1.08vw;
  will-change: font-weight, font-stretch, transform;
}
</style>
</head>
<body>

<p class="hint">Drag any letter up or down</p>

<div class="stage" id="stage">
  <div class="content">
    <h1 class="txt" id="txt">Jello</h1>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  /* ─── Config ─── */
  const weightInit    = 600;
  const weightTarget  = 400;
  const weightDiff    = weightInit - weightTarget;
  const stretchInit   = 150;
  const stretchTarget = 80;
  const stretchDiff   = stretchInit - stretchTarget;
  const maxYScale     = 2.5;
  const elasticDropOff = 0.8;

  /* ─── State ─── */
  const stage   = document.getElementById('stage');
  const txtEl   = document.getElementById('txt');
  let chars     = [];
  let numChars  = 0;
  let charH     = 0;
  let isDown    = false;
  let initY     = 0;
  let finalY    = 0;
  let selIdx    = 0;
  let dragScale = 0;

  /* ─── Split text manually ─── */
  function splitText() {
    const raw = txtEl.textContent.trim();
    txtEl.innerHTML = '';
    [...raw].forEach(ch => {
      const span       = document.createElement('span');
      span.className   = 'char';
      span.textContent = ch;
      txtEl.appendChild(span);
    });
    chars    = Array.from(txtEl.querySelectorAll('.char'));
    numChars = chars.length;
  }

  /* ─── Maths ─── */
  function calcDispersion(index) {
    const d = 1 - Math.abs(index - selIdx) / (numChars * elasticDropOff);
    return d * dragScale;
  }

  function calcDist() {
    const max = charH * (maxYScale - 1);
    dragScale = (initY - finalY) / max;
    dragScale = Math.min(maxYScale - 1, Math.max(-0.5, dragScale));
  }

  /* ─── GSAP updates ─── */
  function setDragFont() {
    gsap.to(chars, {
      y          : i => calcDispersion(i) * -50,
      fontWeight : i => weightInit - calcDispersion(i) * weightDiff,
      fontStretch: i => `${stretchInit - calcDispersion(i) * stretchDiff}%`,
      scaleY     : i => Math.max(0.5, 1 + calcDispersion(i)),
      ease       : 'power4',
      duration   : 0.6
    });
  }

  function snapBack() {
    gsap.to(chars, {
      y          : 0,
      fontWeight : weightInit,
      fontStretch: `${stretchInit}%`,
      scale      : 1,
      ease       : 'elastic(0.35, 0.1)',
      duration   : 1,
      stagger    : { each: 0.02, from: selIdx }
    });
  }

  /* ─── Events ─── */
  function bindEvents() {
    /* Mouse */
    document.addEventListener('mousemove', e => {
      if (!isDown) return;
      finalY = e.clientY;
      calcDist();
      setDragFont();
    });

    document.addEventListener('mouseup', () => {
      if (!isDown) return;
      isDown = false;
      document.body.classList.remove('grabbing');
      snapBack();
    });

    document.addEventListener('mouseleave', e => {
      if (!isDown) return;
      if (e.clientY <= 0 || e.clientX <= 0 ||
          e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
        isDown = false;
        document.body.classList.remove('grabbing');
        snapBack();
      }
    });

    /* Touch */
    document.addEventListener('touchmove', e => {
      if (!isDown) return;
      e.preventDefault();
      finalY = e.touches[0].clientY;
      calcDist();
      setDragFont();
    }, { passive: false });

    document.addEventListener('touchend', () => {
      if (!isDown) return;
      isDown = false;
      snapBack();
    });

    /* Per-char mousedown / touchstart */
    chars.forEach((ch, i) => {
      ch.addEventListener('mousedown', e => {
        initY  = e.clientY;
        selIdx = i;
        isDown = true;
        document.body.classList.add('grabbing');
      });
      ch.addEventListener('touchstart', e => {
        initY  = e.touches[0].clientY;
        selIdx = i;
        isDown = true;
      }, { passive: true });
    });
  }

  /* ─── Init ─── */
  function init() {
    splitText();
    charH = txtEl.offsetHeight;

    gsap.set(stage, { autoAlpha: 1 });
    gsap.set(chars, { transformOrigin: 'center bottom' });

    const rect = txtEl.getBoundingClientRect();
    gsap.from(chars, {
      y          : () => -1 * (rect.y + charH + 500),
      fontWeight : weightTarget,
      fontStretch: `${stretchTarget}%`,
      scaleY     : 2,
      ease       : 'elastic(0.2, 0.1)',
      duration   : 1.5,
      delay      : 0.4,
      stagger    : { each: 0.05, from: 'random' },
      onComplete : bindEvents
    });
  }

  window.addEventListener('load', init);
  window.addEventListener('resize', () => { charH = txtEl.offsetHeight; });
</script>
</body>
</html>

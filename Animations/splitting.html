<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Splitting Animation</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/splitting/dist/splitting.css">
<style>
:root {
  --duration: 6s;
  --wave-duration: calc(var(--duration) * 0.25);
  --text-in-delay: calc(var(--duration) * 0.275);
  --text-in-duration: calc(var(--duration) * 0.1);
  --easing: cubic-bezier(0.5, 0, 0.5, 1);
  --dot-color: #ffd950;
  --dot-color-dark: #977a12;
}

*, *::before, *::after {
  box-sizing: border-box;
  position: relative;
}

html, body {
  height: 100%;
  width: 100%;
  margin: 0;
  padding: 0;
  background: #060506;
  color: white;
  font-family: 'Heebo', sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: center;
  cursor: pointer;
}

/* Hint */
.hint {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0.3;
  color: white;
  font-family: 'Courier New', monospace;
  pointer-events: none;
  white-space: nowrap;
}

.container {
  display: grid;
  align-items: center;
  justify-items: center;
}

.container > * {
  grid-area: 1 / 1;
}

.title {
  font-size: 10vmin;
  margin: 0;
}

/* ── Splitting chars ── */
.title .char {
  --delay: calc(var(--text-in-delay) + (0.25s * (1 - var(--distance-percent, 0.5))));
  animation: text-in var(--text-in-duration) var(--easing) var(--delay) backwards;
  transform-origin: center 1em;
}

@keyframes text-in {
  0% {
    opacity: 0;
    transform: translateX(calc(-0.4em * var(--char-offset, 0))) scale(0);
  }
  90% {
    transform: translateX(0em) scale(1.1);
  }
}

/* squish on 't' and 'i' */
.title .char[data-char="t"],
.title .char[data-char="i"] {
  visibility: hidden;
  --squish-scale: 0.6;
  --squish-y: 10%;
}

.title .char[data-char="t"]::before,
.title .char[data-char="i"]::before {
  content: attr(data-char);
  animation: text-squish var(--duration) var(--easing) forwards;
  visibility: visible;
  transform-origin: center 1em;
  display: block;
}

.title .char[data-char="i"] {
  --squish-scale: 0.9;
  --squish-y: 5%;
}

@keyframes text-squish {
  47.5%, 52.5% { transform: none; }
  50% {
    transform: translateY(calc(var(--squish-y)))
               scaleY(calc(var(--squish-scale)));
  }
}

/* last char bonk */
.title .char:last-child {
  animation:
    text-in var(--text-in-duration) var(--easing) var(--delay) backwards,
    text-bonk var(--duration) var(--easing) forwards;
}

@keyframes text-bonk {
  80%, 85%, to { transform: none; }
  82% { transform: translateX(-20%); }
}

/* ── Dot ── */
.dot {
  font-size: 5vmin;
  width: 1em;
  height: 1em;
  animation: dot var(--duration) var(--easing) both;
}

.dot-inner {
  animation: dot-inner var(--duration) var(--easing) both;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border-radius: 50%;
  overflow: hidden;
  display: grid;
  align-items: center;
  justify-items: center;
}

.dot-inner > * { grid-area: 1 / 1; }

.dot-wave {
  width: 200%;
  height: 200%;
  fill: var(--dot-color);
  animation: wave-in var(--wave-duration) var(--easing);
  --offset-x: -110%;
}

.dot-wave.background {
  fill: var(--dot-color-dark);
  animation-duration: calc(0.95 * var(--wave-duration));
  --offset-x: 110%;
}

@keyframes wave-in {
  0%  { transform: translateY(100%) translateX(var(--offset-x)); }
  70% { transform: translateY(30%)  translateX(0%); }
}

@keyframes dot {
  from         { opacity: 0; transform: scale(3); }
  10%          { opacity: 1; transform: scale(3); }
  15%          { transform: scale(3) translateY(0.5em) scaleY(1.5); }
  20%          { transform: scale(1) translateY(-300%); }
  30%          { transform: translateY(1em) scaleY(0.5); }
  40%          { transform: translateY(-400%); }
  50%          { transform: translateY(-1em); }
  53%          { transform: translateY(-300%); }
  56%          { transform: translateY(-1em); }
  59%          { transform: translateY(-200%); }
  62%          { transform: translateY(1em); }
  80%, 90%, to { transform: translateY(1em); }
}

@keyframes dot-inner {
  from, 45% { transform: none; }
  70% {
    transform: translateX(6em);
    animation-timing-function: cubic-bezier(0.5, 0, 1, 0);
  }
  80% {
    transform: translateX(4.3em);
    animation-timing-function: cubic-bezier(0.5, 0, 0.5, 1);
  }
  83%, to { transform: translateX(4.4em); }
}

/* Pause everything until data-play is set */
body:not([data-play]) *,
body:not([data-play]) *::before,
body:not([data-play]) *::after {
  visibility: hidden !important;
  animation: none !important;
}
</style>
</head>
<body>

<p class="hint">Click anywhere to replay</p>

<div class="container">
  <h1 class="title" data-splitting>Splitting</h1>
  <div class="dot">
    <div class="dot-inner">
      <svg class="dot-wave background" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
        <path d="M799.09 90s11.04 0 0 0c-80.714 0-79.621-90-200-90-120.377 0-118.607 90-200 90-81.391 0-81.215-90-200-90C80.308 0 78.68 89.29-.91 90c-6.946.062 0 0 0 0v510h800V90z"/>
      </svg>
      <svg class="dot-wave foreground" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
        <path d="M799.09 90s11.04 0 0 0c-80.714 0-79.621-90-200-90-120.377 0-118.607 90-200 90-81.391 0-81.215-90-200-90C80.308 0 78.68 89.29-.91 90c-6.946.062 0 0 0 0v510h800V90z"/>
      </svg>
    </div>
  </div>
</div>

<script src="https://unpkg.com/splitting/dist/splitting.min.js"></script>
<script>
  console.clear();
  Splitting();

  function play() {
    requestAnimationFrame(() => {
      document.body.dataset.play = '1';
    });
  }

  function replay() {
    delete document.body.dataset.play;
    requestAnimationFrame(() => requestAnimationFrame(play));
  }

  play();
  document.body.addEventListener('click', replay);
</script>
</body>
</html>

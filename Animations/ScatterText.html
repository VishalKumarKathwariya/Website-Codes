<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Text Scene</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #00b4d8; }
  canvas { display: block; }
  #ui {
    position: fixed; top: 40px; right: 40px; z-index: 2001;
    opacity: 0; transition: opacity 0.5s ease;
  }
  #ui.visible { opacity: 1; }
  #theme-btn {
    background: rgba(255,255,255,0.05);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border-radius: 50%;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border: 0.5px solid rgba(255,255,255,0.2);
    cursor: pointer;
    transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
    outline: none; color: white;
  }
  #theme-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
</style>
</head>
<body>
<div id="ui">
  <button id="theme-btn" title="Switch Theme"></button>
</div>

<!-- Import maps for bare module specifiers -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

// ── Inline CANNON-ES (self-contained physics) ──────────────────────────────
// We'll use a CDN version of cannon-es
const CANNON = await import('https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js');

// ── GSAP via CDN ──────────────────────────────────────────────────────────
const gsapModule = await import('https://unpkg.com/gsap@3.12.5/dist/gsap-core.js').catch(()=>null);
// Fallback simple tweener if GSAP fails
const gsap = window.gsap || {
  to(obj, opts) {
    const start = performance.now();
    const dur = (opts.duration || 0.3) * 1000;
    const keys = Object.keys(opts).filter(k => !['duration','ease','yoyo','repeat','onComplete'].includes(k));
    const from = {};
    keys.forEach(k => from[k] = obj[k]);
    const tick = (now) => {
      let t = Math.min((now - start) / dur, 1);
      if (opts.ease === 'power1.out') t = 1 - (1-t)*(1-t);
      else if (opts.ease === 'power2.out') t = 1 - (1-t)*(1-t)*(1-t);
      keys.forEach(k => { if (typeof from[k] === 'number') obj[k] = from[k] + (opts[k] - from[k]) * t; });
      if (t < 1) requestAnimationFrame(tick);
      else { opts.onComplete && opts.onComplete(); }
    };
    requestAnimationFrame(tick);
  }
};

// ── Config ────────────────────────────────────────────────────────────────
const THEMES = {
  summer:   { bg:'#00b4d8', studio:'#0077b6', activeCol:'#ffea00', ior:1.45 },
  electric: { bg:'#fb5607', studio:'#d04505', activeCol:'#3a86ff', ior:1.49 }
};
const state = {
  text: 'TOUCH',
  mode: 'summer',
  physics: { centeringForce: 0.35, rotationForce: 0.015, damping: 0.98 }
};

// ── Three.js setup ────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(THEMES.summer.bg);

const aspect = window.innerWidth / window.innerHeight;
const orthoSize = 60;
const camera = new THREE.OrthographicCamera(
  orthoSize * aspect / -2, orthoSize * aspect / 2,
  orthoSize / 2, orthoSize / -2, 0.1, 1000
);
camera.position.set(0, 0, 100);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ── Lights ────────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(0, 20, 80);
dirLight.castShadow = true;
dirLight.shadow.bias = -0.0001;
dirLight.shadow.mapSize.set(1024, 1024);
dirLight.shadow.camera.left = dirLight.shadow.camera.bottom = -60;
dirLight.shadow.camera.right = dirLight.shadow.camera.top = 60;
scene.add(dirLight);

// ── HDR Environment ───────────────────────────────────────────────────────
new RGBELoader().load(
  'https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_08_1k.hdr',
  tex => { tex.mapping = THREE.EquirectangularReflectionMapping; scene.environment = tex; }
);

// ── Studio floor ──────────────────────────────────────────────────────────
let floorMesh;
(()=>{
  const geo = new THREE.PlaneGeometry(300, 200, 32, 32);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i);
    if (y > 0) pos.setZ(i, Math.pow(y / 40, 3) * 30);
  }
  geo.computeVertexNormals();
  floorMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: THEMES.summer.studio, roughness: 0.5 }));
  floorMesh.position.set(0, -20, -15);
  floorMesh.receiveShadow = true;
  scene.add(floorMesh);
})();

// ── Physics world ─────────────────────────────────────────────────────────
const world = new CANNON.World();
world.gravity.set(0, 0, 0);
const attractorBody = new CANNON.Body({ mass: 0, shape: new CANNON.Sphere(4) });
world.addBody(attractorBody);

// ── Mouse / touch ─────────────────────────────────────────────────────────
const mouse = new THREE.Vector2(-10, -10);
const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const worldPoint = new THREE.Vector3();

const onMouseMove = e => { mouse.x = e.clientX/innerWidth*2-1; mouse.y = -(e.clientY/innerHeight)*2+1; };
const onTouch = e => { if(e.touches.length){ const t=e.touches[0]; mouse.x=t.clientX/innerWidth*2-1; mouse.y=-(t.clientY/innerHeight)*2+1; } };
window.addEventListener('mousemove', onMouseMove);
window.addEventListener('touchstart', onTouch, { passive: true });
window.addEventListener('touchmove', onTouch, { passive: true });

// ── Letter objects ────────────────────────────────────────────────────────
let letters = [];
let font = null;

function getLetterSize() {
  const w = window.innerWidth;
  return w < 768 ? 5.5 : w < 1200 ? 8 : 10.5;
}

function buildLetters(text) {
  letters.forEach(l => { scene.remove(l.mesh); world.removeBody(l.body); });
  letters = [];
  if (!font) return;

  const theme = THEMES[state.mode];
  const size = getLetterSize();
  const spacing = size * 1.15;
  const totalWidth = (text.length - 1) * spacing;

  for (let i = 0; i < text.length; i++) {
    const geo = new TextGeometry(text[i], {
      font, size, depth: 2.5,
      curveSegments: 32, bevelEnabled: true,
      bevelThickness: 0.7, bevelSize: 0.35,
      bevelOffset: 0, bevelSegments: 16
    });
    geo.center();

    const mat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, transmission: 1,
      ior: theme.ior, thickness: 3.5,
      roughness: 0.015, clearcoat: 0.3,
      attenuationColor: new THREE.Color(0xffffff),
      attenuationDistance: 0.6,
      emissive: new THREE.Color(theme.activeCol),
      emissiveIntensity: 0
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    const body = new CANNON.Body({
      mass: 2,
      shape: new CANNON.Box(new CANNON.Vec3(size * 0.45, size * 0.55, 1.5)),
      linearDamping: state.physics.damping,
      angularDamping: state.physics.damping
    });
    body.position.set(i * spacing - totalWidth / 2, 0, 0);
    body.angularFactor.set(0, 0, 1);
    body.linearFactor.set(1, 1, 0);

    body.addEventListener('collide', evt => {
      const vel = evt.contact.getImpactVelocityAlongNormal();
      if (vel > 1) {
        gsap.to(mesh.scale, { x:1.5, y:1.5, z:1.5, duration:0.01, yoyo:true, repeat:1, ease:'power1.out' });
        gsap.to(mat, { emissiveIntensity: Math.min(vel*0.8,5), duration:0.05 });
        gsap.to(mat, { emissiveIntensity: 0, duration:1.0, ease:'power2.out' });
      }
    });

    world.addBody(body);
    letters.push({ mesh, body, mat, targetX: body.position.x });
  }
}

// ── Font loading ──────────────────────────────────────────────────────────
new FontLoader().load(
  'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/fonts/helvetiker_bold.typeface.json',
  f => { font = f; buildLetters(state.mode === 'summer' ? 'TOUCH' : 'TOUCH'); document.getElementById('ui').classList.add('visible'); }
);

// ── Theme switch ──────────────────────────────────────────────────────────
function switchTheme(mode) {
  if (state.mode === mode) return;
  state.mode = mode;
  const t = THEMES[mode];
  gsap.to(scene.background, { r: new THREE.Color(t.bg).r, g: new THREE.Color(t.bg).g, b: new THREE.Color(t.bg).b, duration:10.2 });
  gsap.to(floorMesh.material.color, { r: new THREE.Color(t.studio).r, g: new THREE.Color(t.studio).g, b: new THREE.Color(t.studio).b, duration:1.2 });
  letters.forEach(l => {
    l.mat.ior = t.ior;
    gsap.to(l.mat.emissive, { r: new THREE.Color(t.activeCol).r, g: new THREE.Color(t.activeCol).g, b: new THREE.Color(t.activeCol).b, duration:1 });
  });
  updateThemeBtn();
}

function updateThemeBtn() {
  const sunSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="10.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="m2 22 20-20"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
  const boltSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="10.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L3 14 L12 14 L11 22 L21 10 L12 10 Z"/></svg>`;
  document.getElementById('theme-btn').innerHTML = state.mode === 'summer' ? sunSvg : boltSvg;
}
updateThemeBtn();

document.getElementById('theme-btn').addEventListener('click', () => {
  switchTheme(state.mode === 'summer' ? 'electric' : 'summer');
});

// ── Resize ────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = orthoSize * a / -2; camera.right = orthoSize * a / 2;
  camera.top = orthoSize / 2; camera.bottom = orthoSize / -2;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (font) buildLetters(state.text);
});

// ── Render loop ───────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let raf;

(function loop() {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.1);

  raycaster.setFromCamera(mouse, camera);
  raycaster.ray.intersectPlane(plane, worldPoint);
  const wp = new CANNON.Vec3(worldPoint.x, worldPoint.y, worldPoint.z);
  attractorBody.position.lerp(wp, 0.2, attractorBody.position);

  world.step(1/60, dt, 3);

  const activeCol = new THREE.Color(THEMES[state.mode].activeCol);
  const white = new THREE.Color(0xffffff);

  letters.forEach(l => {
    // Centering force
    const centForce = new CANNON.Vec3(l.targetX - l.body.position.x, -l.body.position.y, 0);
    centForce.scale(state.physics.centeringForce, centForce);
    l.body.applyImpulse(centForce, l.body.position);

    // Rotation damping
    l.body.angularVelocity.x -= l.body.quaternion.x * state.physics.rotationForce * 10;
    l.body.angularVelocity.y -= l.body.quaternion.y * state.physics.rotationForce * 10;
    l.body.angularVelocity.z -= l.body.quaternion.z * state.physics.rotationForce * 10;

    l.mesh.position.copy(l.body.position);
    l.mesh.quaternion.copy(l.body.quaternion);

    const speed = l.body.velocity.length() + l.body.angularVelocity.length();
    const t2 = Math.min(speed * 0.35, 1);
    l.mat.attenuationColor.lerpColors(white, activeCol, t2);
  });

  const elapsed = clock.getElapsedTime();
  camera.position.x = Math.sin(elapsed * 0.4) * 0.5;
  camera.position.y = Math.cos(elapsed * 0.3) * 0.5;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Particle Effect</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }

  canvas#particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  /* ── Bottom UI ── */
  .ui {
    position: fixed;
    bottom: 48px;
    left: 0; right: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    pointer-events: none;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 1.6s cubic-bezier(.16,1,.3,1) 1.2s forwards;
  }

  .role {
    font-family: 'Courier New', monospace;
    font-size: clamp(0.5rem, 1.2vw, 0.75rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
  }

  .divider {
    width: 1px;
    height: 40px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.28), transparent);
    margin: 18px 0;
  }

  nav {
    display: flex;
    gap: 36px;
    pointer-events: all;
  }

  nav a {
    font-family: 'Courier New', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    text-decoration: none;
    position: relative;
    padding-bottom: 3px;
    transition: color 0.3s;
  }

  nav a::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 1px;
    background: rgba(255,255,255,0.65);
    transition: width 0.35s cubic-bezier(.16,1,.3,1);
  }

  nav a:hover { color: rgba(255,255,255,0.85); }
  nav a:hover::after { width: 100%; }

  /* ── Controls Panel ── */
  .controls {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10;
    background: rgba(15,15,15,0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 190px;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }

  .controls label {
    font-family: 'Courier New', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .controls input[type=range] {
    width: 100%;
    accent-color: #4fc3f7;
    cursor: pointer;
  }

  .controls input[type=color] {
    width: 100%;
    height: 22px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    background: none;
    padding: 0;
  }

  .controls .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .controls .toggle {
    width: 32px; height: 16px;
    background: rgba(255,255,255,0.12);
    border-radius: 8px;
    position: relative;
    cursor: pointer;
    transition: background 0.3s;
    flex-shrink: 0;
  }

  .controls .toggle.on { background: #4fc3f7; }

  .controls .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: white;
    transition: left 0.25s;
  }

  .controls .toggle.on::after { left: 18px; }

  /* Click hint */
  .hint {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.16);
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
    animation: pulse 3.5s ease-in-out 2s infinite;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%,100% { opacity: 0.16; }
    50%      { opacity: 0.45; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<!-- Bottom navigation -->
<div class="ui">
  <span class="role">Design &nbsp;&middot;&nbsp; Development &nbsp;&middot;&nbsp; Motion</span>
  <div class="divider"></div>
  <nav>
    <a href="#">Work</a>
    <a href="#">About</a>
    <a href="#">Process</a>
    <a href="#">Contact</a>
  </nav>
</div>

<!-- Controls panel -->
<div class="controls">
  <label>
    Particle Size &nbsp;<span id="sizeVal">1</span>px
    <input type="range" id="sizeSlider" min="1" max="5" step="1" value="1">
  </label>
  <label>
    Gap &nbsp;<span id="gapVal">1</span>
    <input type="range" id="gapSlider" min="0" max="5" step="1" value="1">
  </label>
  <label>
    Color
    <input type="color" id="colorPicker" value="#4fc3f7">
  </label>
  <label class="row">
    Restless
    <div class="toggle" id="restlessToggle"></div>
  </label>
</div>

<p class="hint">Click anywhere to scatter &amp; reform</p>

<script>
(function () {
  'use strict';

  /* ── Canvas setup ── */
  var canvas = document.getElementById('particles');
  var ctx    = canvas.getContext('2d');

  /* ── State ── */
  var W, H;
  var particles    = [];
  var mouse        = { x: -9999, y: -9999 };
  var ptlSize      = 1;
  var ptlGap       = 1;
  var ptlColor     = '#4fc3f7';
  var restless     = false;
  var scattered    = false;
  var raf;

  /* ── Controls wiring ── */
  var sizeSlider     = document.getElementById('sizeSlider');
  var sizeVal        = document.getElementById('sizeVal');
  var gapSlider      = document.getElementById('gapSlider');
  var gapVal         = document.getElementById('gapVal');
  var colorPicker    = document.getElementById('colorPicker');
  var restlessToggle = document.getElementById('restlessToggle');

  sizeSlider.addEventListener('input', function () {
    ptlSize = +this.value;
    sizeVal.textContent = ptlSize;
    rebuild();
  });

  gapSlider.addEventListener('input', function () {
    ptlGap = +this.value;
    gapVal.textContent = ptlGap;
    rebuild();
  });

  colorPicker.addEventListener('input', function () {
    ptlColor = this.value;
    particles.forEach(function (p) { p.color = ptlColor; });
  });

  restlessToggle.addEventListener('click', function () {
    restless = !restless;
    this.classList.toggle('on', restless);
  });

  /* ── Mouse tracking ── */
  window.addEventListener('mousemove', function (e) {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  window.addEventListener('mouseleave', function () {
    mouse.x = -9999;
    mouse.y = -9999;
  });

  /* Touch support */
  window.addEventListener('touchmove', function (e) {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: true });

  /* ── Click: scatter then reform ── */
  window.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('.controls')) return;
    if (e.target.closest && e.target.closest('.ui'))       return;
    scatter();
    setTimeout(function () { rebuild(); }, 600);
  });

  /* ── Resize ── */
  window.addEventListener('resize', function () {
    resize();
    rebuild();
  });

  /* ══════════════════════════════════════════
     Core: sample text → particle positions
  ══════════════════════════════════════════ */
  function sampleText() {
    /* Offscreen canvas to rasterize text */
    var oc  = document.createElement('canvas');
    oc.width  = W;
    oc.height = H;
    var oc_ctx = oc.getContext('2d');

    oc_ctx.fillStyle = '#000';
    oc_ctx.fillRect(0, 0, W, H);

    /* ── "PORTFOLIO" main text ── */
    var fontSize = Math.floor(W * 0.155);
    oc_ctx.font = 'bold ' + fontSize + 'px Arial, sans-serif';
    oc_ctx.textAlign    = 'center';
    oc_ctx.textBaseline = 'middle';

    /* shrink to fit */
    while (oc_ctx.measureText('PORTFOLIO').width > W * 0.88 && fontSize > 16) {
      fontSize -= 2;
      oc_ctx.font = 'bold ' + fontSize + 'px Arial, sans-serif';
    }

    oc_ctx.fillStyle = '#ffffff';
    oc_ctx.fillText('PORTFOLIO', W / 2, H / 2);

    /* ── "CREATIVE" subtitle ── */
    var subSize = Math.max(10, Math.floor(fontSize * 0.14));
    oc_ctx.font      = subSize + 'px Arial, sans-serif';
    oc_ctx.fillStyle = 'rgba(255,255,255,0.55)';
    oc_ctx.fillText('C  R  E  A  T  I  V  E', W / 2, H / 2 - fontSize * 0.72);

    /* ── Sample every (ptlSize + ptlGap) pixels ── */
    var step    = ptlSize + ptlGap + 1;
    var imgData = oc_ctx.getImageData(0, 0, W, H).data;
    var pts     = [];

    for (var y = 0; y < H; y += step) {
      for (var x = 0; x < W; x += step) {
        var i = (y * W + x) * 4;
        var brightness = (imgData[i] + imgData[i+1] + imgData[i+2]) / 3;
        if (brightness > 30) {
          pts.push({
            tx: x,               /* target x */
            ty: y,               /* target y */
            x : Math.random() * W,
            y : Math.random() * H,
            vx: 0, vy: 0,
            alpha: brightness / 255,
            color: ptlColor
          });
        }
      }
    }
    return pts;
  }

  /* ── Build / rebuild particle array ── */
  function rebuild() {
    particles = sampleText();
    scattered = false;
  }

  /* ── Scatter existing particles ── */
  function scatter() {
    scattered = true;
    particles.forEach(function (p) {
      p.vx = (Math.random() - 0.5) * 18;
      p.vy = (Math.random() - 0.5) * 18;
    });
  }

  /* ── Resize canvas ── */
  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  /* ══════════════════════════════════════════
     Animation loop
  ══════════════════════════════════════════ */
  function lerp(a, b, t) { return a + (b - a) * t; }

  function loop() {
    ctx.clearRect(0, 0, W, H);

    var mouseR2 = 90 * 90; /* mouse repulsion radius squared */

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];

      if (scattered) {
        /* Free flight with friction */
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.x  += p.vx;
        p.y  += p.vy;
      } else {
        /* Spring back to target */
        var dx = p.tx - p.x;
        var dy = p.ty - p.y;

        /* Mouse repulsion */
        var mx = p.x - mouse.x;
        var my = p.y - mouse.y;
        var dist2 = mx * mx + my * my;
        if (dist2 < mouseR2) {
          var force = (1 - dist2 / mouseR2) * 5;
          p.vx += mx * force * 0.08;
          p.vy += my * force * 0.08;
        }

        /* Spring */
        p.vx += dx * 0.08;
        p.vy += dy * 0.08;

        /* Restless random drift */
        if (restless) {
          p.vx += (Math.random() - 0.5) * 0.6;
          p.vy += (Math.random() - 0.5) * 0.6;
        }

        /* Damping */
        p.vx *= 0.78;
        p.vy *= 0.78;

        p.x += p.vx;
        p.y += p.vy;
      }

      /* Draw */
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.min(p.alpha * 1.4, 1);
      ctx.fillRect(
        Math.round(p.x),
        Math.round(p.y),
        ptlSize,
        ptlSize
      );
    }

    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(loop);
  }

  /* ── Boot ── */
  resize();
  rebuild();
  loop();

})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CTA Banner – BPOC</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      overflow-x: hidden;
    }

    /* ─── CTA BANNER ─── */
    .cta-section {
      padding: 48px 24px 56px;
      background: #ffffff;
    }

    .cta-inner {
      max-width: 960px;
      margin: 0 auto;
      background: linear-gradient(135deg, #0d1b6e 0%, #162080 40%, #0e1660 100%);
      border-radius: 16px;
      padding: 56px 48px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* subtle grid pattern inside */
    .cta-inner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
      border-radius: 16px;
    }

    .cta-content { position: relative; z-index: 1; }

    .cta-title {
      font-size: clamp(1.5rem, 3.5vw, 2.3rem);
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .cta-sub {
      margin-top: 12px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.55);
    }

    .cta-actions {
      margin-top: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-green {
      display: inline-block;
      background: #00cc88;
      color: #001510;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 7px;
      text-decoration: none;
      transition: background 0.18s, transform 0.15s;
    }
    .btn-green:hover { background: #00e5a0; transform: translateY(-1px); }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1.5px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.8);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 7px;
      text-decoration: none;
      transition: border-color 0.18s, background 0.18s;
    }
    .btn-ghost:hover {
      border-color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.07);
    }
    .btn-ghost::after { content: '→'; }

    /* ── responsive ── */
    @media (max-width: 540px) {
      .cta-inner { padding: 40px 24px; }
      .cta-actions { flex-direction: column; }
      .btn-green, .btn-ghost { width: 100%; justify-content: center; text-align: center; }
    }
  </style>
</head>
<body>

<section class="cta-section">
  <div class="cta-inner">
    <div class="cta-content">
      <h2 class="cta-title">End Customer Experience is slipping.<br>Do you know where?</h2>
      <p class="cta-sub">Most gaps stay invisible until they start costing you revenue.</p>
      <div class="cta-actions">
        <a href="#" class="btn-green">Let's Find Out</a>
        <a href="#" class="btn-ghost">We're Good </a>
      </div>
    </div>
  </div>
</section>

</body>
</html>

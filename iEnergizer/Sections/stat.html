<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPOC Stats Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #06122b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ─── Grid wrapper ─── */
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.875rem;
      width: 100%;
      max-width: 1140px;
    }

    /* ─── Base card ─── */
    .card {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      padding: 2.25rem 2rem 2rem;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      color: #fff;
    }

    /* Decorative leaf SVG — injected via pseudo + data URI */
    .card__leaf {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 1;
    }

    .card__leaf svg {
      position: absolute;
      right: -6%;
      top: -4%;
      width: 55%;
      height: auto;
      opacity: 0.18;
    }

    /* ─── Card colour variants ─── */
    .card--navy {
      background: linear-gradient(145deg, #0e2148 0%, #112559 100%);
    }
    .card--dark {
      background: linear-gradient(145deg, #111d35 0%, #152240 100%);
    }
    .card--charcoal {
      background: linear-gradient(145deg, #1a1f2e 0%, #1e2740 100%);
    }
    .card--violet {
      background: linear-gradient(145deg, #2a2365 0%, #312c7a 100%);
    }

    /* ─── Content elements ─── */
    .card__number {
      font-size: clamp(3.2rem, 9vw, 5.2rem);
      font-weight: 800;
      line-height: 1;
      color: #00e87c;
      margin-bottom: 0.45rem;
      letter-spacing: -0.02em;
    }

    .card__title {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      margin-bottom: 0.4rem;
    }

    .card__desc {
      font-size: clamp(0.82rem, 2vw, 0.93rem);
      color: rgba(255,255,255,0.65);
      line-height: 1.55;
      max-width: 55ch;
    }

    /* Fornax logo badge */
    .card__logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.1rem;
      font-size: 1.6rem;
      font-weight: 800;
      font-style: italic;
      color: #f5c842;
      background: rgba(255,255,255,0.07);
      flex-shrink: 0;
    }

    .card--fornax {
      justify-content: flex-start;
      padding-top: 2rem;
    }

    .card--fornax .card__title {
      font-size: clamp(1.15rem, 3vw, 1.6rem);
      margin-top: auto;
    }

    /* ─── Tablet: 2 × 2 ─── */
    @media (min-width: 600px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .card { min-height: 220px; }
    }

    /* ─── Desktop: asymmetric like screenshot ─── */
    @media (min-width: 1024px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: auto auto;
      }

      /* Top-left: 1 col */
      .card--years     { grid-column: 1; grid-row: 1; }
      /* Top-right: 2 cols */
      .card--experts   { grid-column: 2 / 4; grid-row: 1; }
      /* Bottom-left: 2 cols */
      .card--industries { grid-column: 1 / 3; grid-row: 2; }
      /* Bottom-right: 1 col */
      .card--fornax    { grid-column: 3; grid-row: 2; }

      .card { min-height: 240px; }
    }

    /* ─── Subtle hover lift ─── */
    .card {
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    }
  </style>
</head>
<body>

  <div class="grid" role="list" aria-label="Company statistics">

    <!-- Card 1: Years of Experience -->
    <article class="card card--navy card--years" role="listitem">
      <div class="card__leaf" aria-hidden="true">
        <svg viewBox="0 0 260 320" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M200 10 C300 60, 280 200, 130 280 C130 280, 40 230, 60 120 C80 30, 160 -20, 200 10Z" fill="white"/>
          <path d="M170 50 C240 90, 220 210, 110 270" stroke="white" stroke-width="2" fill="none" opacity="0.4"/>
        </svg>
      </div>
      <div class="card__number">20+</div>
      <h2 class="card__title">Years of<br>Experience</h2>
    </article>

    <!-- Card 2: Domain Experts -->
    <article class="card card--dark card--experts" role="listitem">
      <div class="card__leaf" aria-hidden="true">
        <svg viewBox="0 0 260 320" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M200 10 C300 60, 280 200, 130 280 C130 280, 40 230, 60 120 C80 30, 160 -20, 200 10Z" fill="white"/>
          <path d="M170 50 C240 90, 220 210, 110 270" stroke="white" stroke-width="2" fill="none" opacity="0.4"/>
        </svg>
      </div>
      <div class="card__number">5,000+</div>
      <h2 class="card__title">Domain Experts</h2>
      <p class="card__desc">A team of professionals handling customer interactions and day-to-day operations across functions.</p>
    </article>

    <!-- Card 3: Industries -->
    <article class="card card--charcoal card--industries" role="listitem">
      <div class="card__leaf" aria-hidden="true">
        <svg viewBox="0 0 260 320" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M200 10 C300 60, 280 200, 130 280 C130 280, 40 230, 60 120 C80 30, 160 -20, 200 10Z" fill="white"/>
          <path d="M170 50 C240 90, 220 210, 110 270" stroke="white" stroke-width="2" fill="none" opacity="0.4"/>
        </svg>
      </div>
      <div class="card__number">10+</div>
      <h2 class="card__title">Industries</h2>
      <p class="card__desc">Including BFSI, Telecom, E-commerce, Logistics, Healthcare, and Manufacturing.</p>
    </article>

    <!-- Card 4: Backed by Fornax -->
    <article class="card card--violet card--fornax" role="listitem">
      <div class="card__leaf" aria-hidden="true">
        <svg viewBox="0 0 260 320" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M200 10 C300 60, 280 200, 130 280 C130 280, 40 230, 60 120 C80 30, 160 -20, 200 10Z" fill="white"/>
        </svg>
      </div>
      <div class="card__logo" aria-label="Fornax logo">𝓕</div>
      <h2 class="card__title">Backed by Fornax</h2>
    </article>

  </div>

</body>
</html>

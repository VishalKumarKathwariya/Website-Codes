<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Component: Footer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=DM+Sans:wght@300;400;500;600&family=Sekuya&display=swap" rel="stylesheet" />

  <style>
    /* ── TOKENS ── */
    :root {
      --bg-1: #0e0e10;
      --accent: #7c6dfa;
      --text-heading: #f0f0f0;
      --text-body: #9090a0;
      --surface-ink: #08080a;
      --surface-footer: #050507;
      --border-dark: rgba(255,255,255,0.06);
      --footer-h: 420px;
      --radius-md: 16px;
      --ease: cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--bg-1);
      color: var(--text-body);
      overflow-x: hidden;
    }

    /* ── SPACER (simulates page content pushing footer down) ── */
    .demo-spacer {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-body);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      font-family: "DM Sans", sans-serif;
      opacity: 0.3;
    }

    /* ── PAGE WRAP (makes footer sticky-bottom effect work) ── */
    .page-wrap {
      position: relative;
      z-index: 10;
      background: var(--bg-1);
      margin-bottom: var(--footer-h);
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      box-shadow: 0 28px 60px rgba(0,0,0,0.45);
    }

    /* ── FOOTER ── */
    .site-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--footer-h);
      background: var(--surface-ink);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 2rem 1.5rem 1.5rem;
      color: #fff;
      z-index: 0;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem 1rem;
      width: 100%;
      height: 100%;
    }

    /* ── LOGO ── */
    .footer-logo {
      font-family: "Dancing Script", cursive;
      font-weight: 600;
      font-style: normal;
      grid-column: 1 / -1;
      font-size: clamp(3.5rem, 13vw, 6rem);
      line-height: 0.85;
      color: #fff;
      display: flex;
      align-items: flex-end;
      transition: color 0.3s ease;
      cursor: default;
      -webkit-user-select: none;
      user-select: none;
    }
    .footer-logo:hover { color: var(--accent); }

    /* ── NAV LINKS ── */
    .footer-links {
      grid-column: 1 / 2;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0.8rem;
      font-size: 0.95rem;
    }
    .footer-links a {
      color: var(--text-heading);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      font-weight: 300;
      display: inline-block;
    }
    .footer-links a:hover {
      color: var(--accent);
      transform: translateX(4px);
    }

    /* ── CONTACT ── */
    .footer-contact {
      grid-column: 2 / 3;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      font-size: 0.8rem;
      color: var(--text-heading);
      font-weight: 300;
    }
    .footer-contact p {
      margin-bottom: 1rem;
      line-height: 1.6;
    }
    .footer-contact p:last-child { margin-bottom: 0; }
    .footer-contact a {
      color: var(--text-heading);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-contact a:hover { color: var(--accent); }

    /* ── SOCIAL + COPYRIGHT ── */
    .footer-social-copy {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-dark);
      padding-top: 1rem;
      margin-top: 0.5rem;
    }

    .f-socials {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .f-socials a {
      color: var(--text-heading);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease, transform 0.2s ease;
    }
    .f-socials a:hover {
      color: var(--accent);
      transform: translateY(-3px);
    }
    .f-socials svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .f-copy {
      font-family: "Sekuya", system-ui;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--accent);
    }

    /* ── RESPONSIVE: min-width 768px ── */
    @media (min-width: 768px) {
      :root { --footer-h: 340px; }

      .site-footer { padding: 2.5rem 3rem; }

      .footer-grid {
        grid-template-columns: 2.5fr 1fr 1.5fr 1fr;
        align-items: stretch;
        gap: 2rem;
      }
      .footer-logo {
        grid-column: auto;
        padding-bottom: 0;
      }
      .footer-links {
        grid-column: auto;
        justify-content: flex-end;
        padding-bottom: 0.4rem;
      }
      .footer-contact {
        grid-column: auto;
        justify-content: flex-end;
        font-size: 0.95rem;
        padding-bottom: 0.4rem;
      }
      .footer-social-copy {
        grid-column: auto;
        flex-direction: column;
        align-items: flex-end;
        justify-content: space-between;
        border-top: none;
        padding-top: 0;
        margin-top: 0;
        padding-bottom: 0.4rem;
      }
    }

    /* ── RESPONSIVE: min-width 1024px ── */
    @media (min-width: 1024px) {
      :root { --footer-h: 300px; }

      .site-footer { padding: 3rem 4rem 2.5rem; }

      .footer-grid {
        grid-template-columns: 3fr 1fr 1.5fr 1fr;
        gap: 2rem;
      }
    }
  </style>
</head>
<body>

  <script>
    /* ── FOOTER: Animate in on first scroll into view ── */
    const footer = document.querySelector(".site-footer");

    /* The footer is fixed, so it's always "visible" —
       we animate the grid children on page load instead */
    const footerChildren = document.querySelectorAll(
      ".footer-logo, .footer-links, .footer-contact, .footer-social-copy"
    );

    footerChildren.forEach((el, i) => {
      el.style.opacity = "0";
      el.style.transform = "translateY(16px)";
      el.style.transition = `opacity 0.5s ease ${i * 0.08}s, transform 0.5s ease ${i * 0.08}s`;
    });

    /* Trigger after a short delay so user sees the animation */
    window.addEventListener("load", () => {
      setTimeout(() => {
        footerChildren.forEach(el => {
          el.style.opacity = "1";
          el.style.transform = "translateY(0)";
        });
      }, 300);
    });

    /* ── Current year auto-update ── */
    const copyEl = document.querySelector(".f-copy");
    if (copyEl) {
      copyEl.textContent = `© Vishal ${new Date().getFullYear()}`;
    }
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Component: Hero Section</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════
       RESET
    ═══════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ═══════════════════════════════════════════
       TOKENS — portfolio design system
    ═══════════════════════════════════════════ */
    :root {
      --bg:           #0e0e10;
      --bg-2:         #141416;
      --accent:       #7c6dfa;
      --accent-tint:  #1e1a3a;
      --accent-glow:  rgba(124,109,250,0.22);
      --text-head:    #f0f0f0;
      --text-body:    #9090a0;
      --text-muted:   #55555f;
      --border-dark:  rgba(255,255,255,0.06);
      --border-light: rgba(255,255,255,0.10);
      --ease:         cubic-bezier(0.4,0,0.2,1);
      --ease-out:     cubic-bezier(0.16,1,0.3,1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: "DM Sans", sans-serif;
      background: var(--bg);
      color: var(--text-body);
      overflow-x: hidden;
    }

    /* ═══════════════════════════════════════════
       HERO SECTION
       — Full viewport, content centred,
         3D fills the entire background
    ═══════════════════════════════════════════ */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      isolation: isolate;
    }

    /* ─── THREE.JS CANVAS ─── */
    #hero-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ─── DOT GRID OVERLAY ─── */
    .hero-grid {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 36px 36px;
       -webkit-mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 0%, transparent 100%);
      mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 0%, transparent 100%);
    }

    /* ─── CENTRE VEIL ─── */
    /* Dark veil at edges so coins stay vivid
       but text at centre is always readable */
    .hero-veil {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(
        ellipse 70% 70% at 50% 50%,
        rgba(14,14,16,0.55) 0%,
        rgba(14,14,16,0.75) 60%,
        rgba(14,14,16,0.92) 100%
      );
    }

    /* ─── BOTTOM FADE ─── */
    .hero-fade-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(to top, var(--bg) 0%, transparent 100%);
    }

    /* ═══════════════════════════════════════════
       CENTRED TEXT CONTENT
    ═══════════════════════════════════════════ */
    .hero-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(2rem, 6vw, 4rem) clamp(1.5rem, 6vw, 4rem);
      width: 100%;
      max-width: 860px;
    }

    /* ── Main heading ── */
    .hero-heading {
      margin-bottom: clamp(2rem, 4vw, 3rem);
      opacity: 0;
      transform: translateY(18px);
    }

    .h-line-1 {
      display: block;
      font-family: "DM Sans", sans-serif;
      font-size: clamp(2.4rem, 6vw, 6rem);
      font-weight: 300;
      line-height: 1.02;
      letter-spacing: -0.035em;
      color: var(--text-head);
    }
    .h-line-2 {
      display: block;
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: clamp(2.7rem, 6.5vw, 6.5rem);
      font-weight: 700;
      line-height: 1.0;
      letter-spacing: -0.02em;
      color: var(--accent);
      position: relative;
    }
    /* Sweep underline */
    .h-line-2::after {
      content: "";
      position: absolute;
      left: 50%; transform: translateX(-50%);
      bottom: -4px;
      width: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 2px;
      transition: width 1s var(--ease) 1.1s;
    }
    .h-line-2.underline-in::after { width: 65%; }

    .h-line-3 {
      display: block;
      font-family: "DM Sans", sans-serif;
      font-size: clamp(2.4rem, 6vw, 6rem);
      font-weight: 300;
      line-height: 1.02;
      letter-spacing: -0.035em;
      color: var(--text-head);
    }
    /* Ghost outline on last word */
    .ghost {
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(240,240,240,0.3);
    }

    /* ── CTA row ── */
    .hero-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(14px);
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 30px;
      background: var(--accent);
      color: #fff;
      font-family: "DM Sans", sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      border-radius: 6px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 26px rgba(124,109,250,0.42);
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }
    .btn-primary::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(130deg, rgba(255,255,255,0.1) 0%, transparent 55%);
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,109,250,0.58); }
    .btn-primary:hover::before { opacity: 1; }
    .btn-primary:active { transform: scale(0.97); }

    .btn-icon {
      width: 20px; height: 20px;
      border: 1.5px solid rgba(255,255,255,0.38);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
    }
    .btn-primary:hover .btn-icon { transform: rotate(45deg); }
    .btn-icon svg { width: 9px; height: 9px; stroke: #fff; stroke-width: 2; fill: none; }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 30px;
      background: transparent;
      color: var(--text-head);
      font-family: "DM Sans", sans-serif;
      font-size: 0.88rem;
      font-weight: 400;
      border-radius: 6px;
      text-decoration: none;
      border: 1px solid var(--border-light);
      cursor: pointer;
      transition: border-color 0.25s ease, background 0.25s ease, transform 0.25s ease;
    }
    .btn-ghost:hover { border-color: var(--accent); background: var(--accent-tint); transform: translateY(-2px); }

    /* ═══════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════ */
    @media (max-width: 480px) {
      .ghost { -webkit-text-stroke: 1px rgba(240,240,240,0.2); }
      .hero-cta { flex-direction: column; width: 100%; }
      .btn-primary, .btn-ghost { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════
     HERO SECTION
═══════════════════════════════════════════ -->
<section class="hero" id="hero">

  <!-- Three.js renders here -->
  <div id="hero-canvas"></div>

  <!-- Atmosphere layers -->
  <div class="hero-grid"></div>
  <div class="hero-veil"></div>
  <div class="hero-fade-bottom"></div>

  <!-- ── Centred: Heading + CTAs only ── -->
  <div class="hero-content">

    <!-- Heading -->
    <h1 class="hero-heading" id="hHeading">
      <span class="h-line-1">Crafting digital</span>
      <span class="h-line-2" id="hLine2">experiences</span>
      <span class="h-line-3">that drive <span class="ghost">results.</span></span>
    </h1>

    <!-- CTAs -->
    <div class="hero-cta" id="hCta">
      <a href="#reviews" class="btn-primary">
        View My Work
        <span class="btn-icon">
          <svg viewBox="0 0 10 10"><line x1="1" y1="9" x2="9" y2="1"/><polyline points="4,1 9,1 9,6"/></svg>
        </span>
      </a>
      <a href="#contact" class="btn-ghost">Get in Touch</a>
    </div>

  </div><!-- /.hero-content -->

</section>

<!-- ═══════════════════════════════════════════
     THREE.JS — COIN RING (portfolio themed)
═══════════════════════════════════════════ -->
<script type="importmap">
{
  "imports": {
    "three":          "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/":  "https://unpkg.com/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Portfolio accent palette — matches --accent #7c6dfa ── */
const PALETTE = [
  0x7c6dfa, 0x6a5ce8, 0x8f82fb, 0x5a4dd4,
  0xa09afc, 0x4a3dc0, 0xb8b4fd, 0x3a2dac,
  0x9d94fc, 0x6355d8, 0x7c6dfa, 0x5248c8,
  0x8880fb, 0x7060f0, 0x6558e0
];

/* ── Renderer ── */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const container = document.getElementById('hero-canvas');
container.appendChild(renderer.domElement);
renderer.domElement.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';

/* ── Scene / Camera ── */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);

/* ── Minimal env map (no HDRI needed) ── */
const pmrem  = new THREE.PMREMGenerator(renderer);
const envPx  = new Uint8Array([160,160,180, 160,160,180, 160,160,180, 160,160,180]);
const envTex = new THREE.DataTexture(envPx, 2, 2, THREE.RGBFormat);
envTex.needsUpdate = true;
scene.environment = pmrem.fromEquirectangular(envTex).texture;
pmrem.dispose();

/* ── Lights ── */
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const key = new THREE.DirectionalLight(0xc8c0ff, 2.0);  /* purple-tinted key */
key.position.set(4, 8, 6);
key.castShadow = true;
scene.add(key);

const rim = new THREE.DirectionalLight(0x7c6dfa, 1.2);  /* accent rim */
rim.position.set(-6, 2, -4);
scene.add(rim);

const fill = new THREE.DirectionalLight(0x9090a0, 0.4);
fill.position.set(0, -4, 4);
scene.add(fill);

/* ── Point light in the ring centre for glow feel ── */
const centre = new THREE.PointLight(0x7c6dfa, 1.8, 12);
centre.position.set(0, 0, 0);
scene.add(centre);

/* ── Coin geometry ── */
const N   = 15;
const geo = new THREE.CylinderGeometry(0.65, 0.65, 0.13, 64);

const grp = new THREE.Group();
scene.add(grp);

const coins = [];

for (let i = 0; i < N; i++) {
  const pivot = new THREE.Group();
  pivot.userData.baseY = i % 2 === 0 ? 0.14 : -0.14;

  const mat = new THREE.MeshStandardMaterial({
    color:            PALETTE[i % PALETTE.length],
    metalness:        0.75,
    roughness:        0.22,
    envMapIntensity:  2.0,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;

  /* orient coin faces outward in the ring */
  mesh.rotation.y = (i / N) * Math.PI * 2 + Math.PI / 2;
  mesh.rotation.z = Math.PI / 2;

  pivot.add(mesh);
  grp.add(pivot);
  coins.push(pivot);
}

/* ── OrbitControls (disabled by default — auto-rotates) ── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enabled = false;  /* keep disabled for clean hero feel */

/* ── Resize ── */
const isMob = () => window.innerWidth < 768;

function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  /* Ring always centred — layout is no longer split */
  grp.position.x = 0;

  if (isMob()) {
    /* Mobile: pull back so ring fits smaller screen */
    camera.position.set(0, 0, 13);
    controls.target.set(0, 0, 0);
  } else {
    /* Desktop: slightly closer, ring fills hero beautifully */
    camera.position.set(0, 0, 9);
    controls.target.set(0, 0, 0);
  }
}

resize();
window.addEventListener('resize', resize);

/* ── Animation loop ── */
const lerp = (a, b, f) => a + (b - a) * f;
let   t = 0, prog = 0;

(function loop() {
  requestAnimationFrame(loop);

  t    += 0.005;
  prog  = Math.min(prog + 0.008, 3);
  const r = prog / 3;
  const m = isMob();

  const yBase = 0;   /* ring centred vertically */
  const xBase = 0;   /* ring centred horizontally */

  /* Ring breathe + rotate */
  grp.position.y   = yBase + Math.sin(t * 1.2) * 0.08;
  grp.rotation.y  += 0.0075;
  grp.rotation.x   = Math.PI / 2 + Math.sin(t * 0.6) * 0.03;

  /* Subtle camera drift */
  camera.position.x += (Math.sin(t * 0.5) * 0.002);
  camera.position.y += (Math.cos(t * 0.4) * 0.002);
  camera.lookAt(xBase, yBase, 0);

  /* Centre glow pulse */
  centre.intensity = 1.8 + Math.sin(t * 2) * 0.4;

  /* Per-coin animation */
  coins.forEach((pivot, i) => {
    const delay = (i / N) * 0.8;
    const g     = Math.max(0, Math.min((r - delay) / 0.4, 1));
    const ease  = 1 - Math.pow(1 - g, 4);
    const angle = (i / N) * Math.PI * 2;
    const orb   = 4 + Math.sin(t * 1.2) * 0.1;
    const C     = Math.cos(t * 2 + i * 0.6);
    const yF    = (C * 0.25 + pivot.userData.baseY) * (g > 0.9 ? 1 : g);

    pivot.position.x = lerp(0, Math.cos(angle) * orb, ease);
    pivot.position.z = lerp(0, Math.sin(angle) * orb, ease);
    pivot.position.y = lerp(-1.5 + i * 0.1, yF, ease);

    const s = lerp(0, 1, Math.min(g * 1.5, 1));
    pivot.scale.set(s, s * (1 + Math.abs(C) * 0.03), s);
    pivot.rotation.x = C * 0.12 * ease;
    pivot.children[0].rotation.x += 0.004 * g;
  });

  controls.update();
  renderer.render(scene, camera);
})();
</script>

<!-- ═══════════════════════════════════════════
     UI ANIMATIONS
═══════════════════════════════════════════ -->
<script>
  /* ── Staggered entrance ── */
  const sequence = [
    { id: "hStatus",  delay: 200  },
    { id: "hEyebrow", delay: 360  },
    { id: "hHeading", delay: 500  },
    { id: "hDesc",    delay: 660  },
    { id: "hCta",     delay: 780  },
    { id: "hStats",   delay: 920  },
  ];

  window.addEventListener("load", () => {
    sequence.forEach(({ id, delay }) => {
      const el = document.getElementById(id);
      if (!el) return;
      setTimeout(() => {
        el.style.transition = "opacity 0.75s ease, transform 0.75s ease";
        el.style.opacity    = "1";
        el.style.transform  = "translateY(0)";
      }, delay);
    });

    /* Underline sweep on italic word */
    setTimeout(() => {
      const mid = document.getElementById("hLine2");
      if (mid) mid.classList.add("underline-in");
    }, 1100);

    /* Show scroll hint */
    setTimeout(() => {
      const sh = document.getElementById("scrollHint");
      if (sh) sh.classList.add("visible");
    }, 1400);
  });

  /* ── Stats counter ── */
  function countUp(el, target, duration) {
    let start = 0;
    const em  = el.querySelector("em");
    const step = target / (duration / 16);
    const tick = setInterval(() => {
      start = Math.min(start + step, target);
      el.childNodes[0].nodeValue = Math.floor(start);
      if (start >= target) clearInterval(tick);
    }, 16);
  }

  const statsObs = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.querySelectorAll(".stat-num").forEach(el => {
        const target = parseInt(el.dataset.target);
        const em     = el.querySelector("em").outerHTML;
        el.innerHTML = `0${em}`;
        countUp(el, target, 900);
      });
      statsObs.unobserve(entry.target);
    });
  }, { threshold: 0.5 });

  const statsEl = document.getElementById("hStats");
  if (statsEl) statsObs.observe(statsEl);

  /* ── Hide scroll hint on scroll ── */
  const sh = document.getElementById("scrollHint");
  window.addEventListener("scroll", () => {
    if (!sh) return;
    if (window.scrollY > 80) {
      sh.classList.remove("visible");
      sh.classList.add("hidden");
    } else {
      sh.classList.remove("hidden");
      sh.classList.add("visible");
    }
  }, { passive: true });

  /* ── Mouse parallax on glows (desktop only) ── */
  if (window.matchMedia("(hover: hover)").matches) {
    document.addEventListener("mousemove", e => {
      const x = (e.clientX / window.innerWidth  - 0.5) * 20;
      const y = (e.clientY / window.innerHeight - 0.5) * 14;
      const grid = document.querySelector(".hero-grid");
      if (grid) grid.style.transform = `translate(${x * 0.3}px, ${y * 0.3}px)`;
    });
  }
</script>

</body>
</html>

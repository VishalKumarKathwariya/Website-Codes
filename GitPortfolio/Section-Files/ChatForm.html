<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Vishal Kumar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
          "jsm/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
        }
      }
    </script>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --ink: #0a0a0c;
        --ink-2: #111115;
        --ink-3: #17171c;
        --ink-4: #1e1e25;
        --ink-5: #25252e;
        --gold: #c8974a;
        --gold-l: #ddb06b;
        --gold-d: #9e7237;
        --gold-tint: rgba(200, 151, 74, 0.08);
        --gold-glow: rgba(200, 151, 74, 0.22);
        --gold-bdr: rgba(200, 151, 74, 0.28);
        --wa: #25d366;
        --wa-dark: #128c7e;
        --cream: #f2ece0;
        --text-1: #f2ece0;
        --text-2: #998f80;
        --text-3: #52504a;
        --border: rgba(255, 255, 255, 0.07);
        --border-2: rgba(255, 255, 255, 0.12);
        --r-sm: 6px;
        --r-md: 14px;
        --r-lg: 22px;
        --r-xl: 30px;
        --ease: cubic-bezier(0.4, 0, 0.2, 1);
        --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Outfit", sans-serif;
        background: var(--ink);
        color: var(--text-2);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse 70% 60% at 20% 80%,
            rgba(200, 151, 74, 0.06) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse 50% 50% at 80% 20%,
            rgba(37, 211, 102, 0.04) 0%,
            transparent 55%
          );
      }

      /* Demo backdrop label */
      .demo-label {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
        text-align: center;
      }
      .demo-label-eyebrow {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.62rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.08);
        margin-bottom: 1rem;
      }
      .demo-label h1 {
        font-family: "Fraunces", serif;
        font-size: clamp(2.2rem, 7vw, 5rem);
        font-weight: 300;
        color: rgba(255, 255, 255, 0.04);
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .demo-label h1 em {
        font-style: italic;
        font-weight: 400;
        color: rgba(200, 151, 74, 0.06);
      }
      .demo-label p {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.6rem;
        letter-spacing: 0.18em;
        color: rgba(255, 255, 255, 0.06);
        margin-top: 1.4rem;
      }

      /* ── FAB CLUSTER ── */
      .fab-cluster {
        position: fixed;
        bottom: 2.2rem;
        right: 2.2rem;
        z-index: 800;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
      }
      .fab-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .fab-pill {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.58rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-1);
        background: var(--ink-3);
        border: 1px solid var(--border-2);
        border-radius: 99px;
        padding: 6px 13px;
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        transform: translateX(8px);
        transition:
          opacity 0.2s var(--ease),
          transform 0.2s var(--ease);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      .fab-item:hover .fab-pill {
        opacity: 1;
        transform: translateX(0);
      }
      .fab-btn {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        outline: none;
        flex-shrink: 0;
        transition:
          transform 0.25s var(--spring),
          box-shadow 0.25s var(--ease);
      }
      .fab-btn:hover {
        transform: scale(1.1) translateY(-3px);
      }
      .fab-btn:active {
        transform: scale(0.95);
        transition-duration: 0.1s;
      }
      .fab-btn svg {
        flex-shrink: 0;
      }
      .fab-wa {
        background: linear-gradient(145deg, var(--wa-dark), var(--wa));
        box-shadow:
          0 6px 20px rgba(37, 211, 102, 0.28),
          0 2px 8px rgba(0, 0, 0, 0.4);
      }
      .fab-wa:hover {
        box-shadow:
          0 12px 32px rgba(37, 211, 102, 0.42),
          0 2px 8px rgba(0, 0, 0, 0.4);
      }
      .fab-wa svg {
        width: 22px;
        height: 22px;
        fill: #fff;
      }
      .fab-contact {
        background: linear-gradient(145deg, var(--gold-d), var(--gold));
        box-shadow:
          0 6px 20px var(--gold-glow),
          0 2px 8px rgba(0, 0, 0, 0.4);
      }
      .fab-contact:hover {
        box-shadow:
          0 12px 32px rgba(200, 151, 74, 0.38),
          0 2px 8px rgba(0, 0, 0, 0.4);
      }
      .fab-contact svg {
        width: 20px;
        height: 20px;
        stroke: var(--ink);
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fab-contact.active {
        background: linear-gradient(145deg, #a83030, #e04444);
        box-shadow: 0 6px 20px rgba(224, 68, 68, 0.3);
      }
      .fab-contact.active #fabIconMail {
        display: none;
      }
      .fab-contact:not(.active) #fabIconClose {
        display: none;
      }
      .fab-btn::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        opacity: 0;
        animation: fabPulse 3s ease-in-out infinite;
      }
      .fab-wa::after {
        border: 1.5px solid var(--wa);
        animation-delay: 0s;
      }
      .fab-contact::after {
        border: 1.5px solid var(--gold);
        animation-delay: 1.2s;
      }
      .fab-contact.active::after {
        border-color: #e04444;
      }
      @keyframes fabPulse {
        0% {
          opacity: 0;
          transform: scale(1);
        }
        35% {
          opacity: 0.6;
          transform: scale(1.2);
        }
        100% {
          opacity: 0;
          transform: scale(1.45);
        }
      }

      /* ── OVERLAY ── */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 900;
        background: rgba(6, 6, 8, 0.82);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s var(--ease);
      }
      .overlay.open {
        opacity: 1;
        pointer-events: auto;
      }

      /* ── MODAL ── */
      .modal {
        background: var(--ink-2);
        border: 1px solid var(--border);
        width: 100%;
        max-width: 100%;
        max-height: 92dvh;
        border-radius: var(--r-xl) var(--r-xl) 0 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: translateY(72px);
        transition: transform 0.45s var(--spring);
        box-shadow:
          0 -40px 100px rgba(0, 0, 0, 0.8),
          0 -1px 0 rgba(255, 255, 255, 0.06);
        position: relative;
      }
      .overlay.open .modal {
        transform: translateY(0);
      }
      .modal-handle {
        width: 36px;
        height: 3px;
        background: var(--border-2);
        border-radius: 99px;
        margin: 12px auto 0;
        flex-shrink: 0;
      }
      .modal-close {
        position: absolute;
        top: 14px;
        right: 16px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--ink-4);
        border: 1px solid var(--border);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-2);
        z-index: 10;
        transition:
          background 0.2s,
          color 0.2s;
      }
      .modal-close:hover {
        background: rgba(224, 68, 68, 0.15);
        color: #e04444;
      }
      .modal-close svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
      }
      .modal-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
      }

      /* ── ART PANE (desktop only) ── */
      .art-pane {
        display: none;
      }

      /* ── CHAT PANE ── */
      .chat-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--ink-2);
      }
      .chat-header {
        background: var(--ink-3);
        border-bottom: 1px solid var(--border);
        padding: 14px 18px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .chat-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        flex-shrink: 0;
        background: linear-gradient(145deg, var(--gold-d), var(--gold));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 16px var(--gold-glow);
        position: relative;
      }
      .chat-avatar::after {
        content: "";
        position: absolute;
        bottom: 1px;
        right: 1px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #22c55e;
        border: 2px solid var(--ink-3);
      }
      .chat-avatar svg {
        width: 16px;
        height: 16px;
        stroke: var(--ink);
        fill: none;
        stroke-width: 2;
      }
      .chat-info {
        flex: 1;
        min-width: 0;
      }
      .chat-name {
        font-family: "Fraunces", serif;
        font-size: 0.92rem;
        font-weight: 500;
        color: var(--text-1);
        letter-spacing: -0.01em;
      }
      .chat-sub {
        font-size: 11px;
        color: var(--text-3);
        font-family: "JetBrains Mono", monospace;
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 2px;
      }
      .online-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #22c55e;
        flex-shrink: 0;
      }
      .win-dots {
        display: flex;
        gap: 5px;
      }
      .win-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .win-dot:nth-child(1) {
        background: #ff5f57;
      }
      .win-dot:nth-child(2) {
        background: #febc2e;
      }
      .win-dot:nth-child(3) {
        background: #28c840;
      }
      .chat-feed {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        scroll-behavior: smooth;
      }
      .chat-feed::-webkit-scrollbar {
        width: 2px;
      }
      .chat-feed::-webkit-scrollbar-thumb {
        background: var(--gold-bdr);
        border-radius: 99px;
      }
      .msg {
        max-width: 78%;
        display: flex;
        flex-direction: column;
        gap: 4px;
        opacity: 0;
        transform: translateY(10px);
        animation: msgIn 0.32s var(--ease) forwards;
      }
      @keyframes msgIn {
        to {
          opacity: 1;
          transform: none;
        }
      }
      .msg-bot {
        align-self: flex-start;
      }
      .msg-user {
        align-self: flex-end;
      }
      .bot-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }
      .mini-av {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        flex-shrink: 0;
        background: linear-gradient(145deg, var(--gold-d), var(--gold));
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
      }
      .mini-av svg {
        width: 11px;
        height: 11px;
        stroke: var(--ink);
        fill: none;
        stroke-width: 2;
      }
      .bubble {
        padding: 11px 15px;
        font-size: 13.5px;
        line-height: 1.65;
        white-space: pre-line;
      }
      .msg-bot .bubble {
        background: var(--ink-4);
        border: 1px solid var(--border);
        border-radius: 16px 16px 16px 4px;
        color: var(--text-1);
      }
      .msg-user .bubble {
        background: linear-gradient(135deg, var(--gold-d), var(--gold));
        color: var(--ink);
        border-radius: 16px 16px 4px 16px;
        font-weight: 500;
        box-shadow: 0 4px 16px var(--gold-glow);
      }
      .msg-time {
        font-size: 10px;
        color: var(--text-3);
        font-family: "JetBrains Mono", monospace;
        align-self: flex-start;
        padding-left: 2px;
      }
      .msg-user .msg-time {
        align-self: flex-end;
        padding-left: 0;
        padding-right: 2px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 4px;
        align-self: flex-start;
        opacity: 0;
        animation: msgIn 0.32s var(--ease) 0.12s forwards;
      }
      .chip {
        padding: 7px 14px;
        border-radius: 99px;
        background: var(--ink-4);
        border: 1px solid var(--gold-bdr);
        font-size: 12px;
        color: var(--gold-l);
        font-family: "Outfit", sans-serif;
        font-weight: 500;
        cursor: pointer;
        transition:
          background 0.18s,
          border-color 0.18s,
          color 0.18s,
          transform 0.18s;
      }
      .chip:hover {
        background: var(--gold-tint);
        border-color: var(--gold);
        color: var(--text-1);
        transform: translateY(-1px);
      }
      .chip.used {
        opacity: 0.3;
        pointer-events: none;
      }
      .typing {
        display: none;
        align-items: center;
        gap: 4px;
        padding: 12px 15px;
        background: var(--ink-4);
        border: 1px solid var(--border);
        border-radius: 16px 16px 16px 4px;
        width: fit-content;
      }
      .typing.show {
        display: flex;
      }
      .t-dot {
        width: 5.5px;
        height: 5.5px;
        border-radius: 50%;
        background: var(--text-3);
        animation: bounce 1.3s infinite;
      }
      .t-dot:nth-child(2) {
        animation-delay: 0.15s;
      }
      .t-dot:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        30% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }
      .chat-input-bar {
        background: var(--ink-3);
        border-top: 1px solid var(--border);
        padding: 13px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .chat-input {
        flex: 1;
        background: var(--ink-4);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 10px 18px;
        font-family: "Outfit", sans-serif;
        font-size: 13.5px;
        color: var(--text-1);
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      .chat-input:focus {
        border-color: var(--gold-bdr);
        box-shadow: 0 0 0 3px rgba(200, 151, 74, 0.08);
      }
      .chat-input::placeholder {
        color: var(--text-3);
      }
      .chat-input:disabled {
        opacity: 0.35;
        pointer-events: none;
      }
      .send-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        flex-shrink: 0;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, var(--gold-d), var(--gold));
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px var(--gold-glow);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .send-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 6px 20px var(--gold-glow);
      }
      .send-btn:active {
        transform: scale(0.95);
      }
      .send-btn:disabled {
        opacity: 0.35;
        pointer-events: none;
      }
      .send-btn svg {
        width: 14px;
        height: 14px;
        stroke: var(--ink);
        fill: none;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* ── DESKTOP ≥ 640px ── */
      @media (min-width: 640px) {
        .overlay {
          align-items: center;
          padding: 1.5rem;
        }
        .modal {
          max-width: 860px;
          width: 100%;
          height: 560px;
          max-height: 88dvh;
          border-radius: var(--r-xl);
          transform: translateY(40px) scale(0.95);
        }
        .overlay.open .modal {
          transform: translateY(0) scale(1);
        }
        .modal-handle {
          display: none;
        }
        .modal-body {
          flex-direction: row;
          height: 560px;
        }

        /* Art pane — pure Three.js canvas, no inner content */
        .art-pane {
          display: block;
          width: 40%;
          flex-shrink: 0;
          position: relative;
          overflow: hidden;
          background: #17171c;
          border-right: 1px solid var(--border);
        }

        /* The canvas fills the pane completely */
        .art-pane canvas {
          position: absolute;
          inset: 0;
          width: 100% !important;
          height: 100% !important;
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <div class="demo-label" aria-hidden="true">
      <div class="demo-label-eyebrow">Portfolio · 2025</div>
      <h1>Let's build<br /><em>something</em></h1>
      <p>// buttons — bottom right corner</p>
    </div>

    <!-- FAB CLUSTER -->
    <div class="fab-cluster" role="region" aria-label="Quick contact">
      <div class="fab-item">
        <span class="fab-pill">Chat on WhatsApp</span>
        <a
          class="fab-btn fab-wa"
          href="https://wa.me/917668245608"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Chat on WhatsApp"
        >
          <svg viewBox="0 0 24 24">
            <path
              d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
            />
          </svg>
        </a>
      </div>
      <div class="fab-item">
        <span class="fab-pill">Send a message</span>
        <button
          class="fab-btn fab-contact"
          id="fabBtn"
          aria-label="Open contact form"
          aria-expanded="false"
        >
          <svg id="fabIconMail" viewBox="0 0 24 24">
            <path
              d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
            />
            <polyline points="22,6 12,13 2,6" />
          </svg>

    <div

        <div class="modal-body">
          <!-- ART PANE — Three.js canvas injected here by JS -->

    <!-- ══ THREE.JS FRACTURE RING ══ -->
    <script type="module">
      import * as THREE from "three";
      import { EffectComposer } from "jsm/postprocessing/EffectComposer.js";
      import { RenderPass } from "jsm/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "jsm/postprocessing/UnrealBloomPass.js";
      import { ShaderPass } from "jsm/postprocessing/ShaderPass.js";
      import { FXAAShader } from "jsm/shaders/FXAAShader.js";

      const artPane = document.getElementById("artPane");

      // Create & inject canvas
      const canvas = document.createElement("canvas");
      artPane.appendChild(canvas);

      function paneSize() {
        return {
          w: artPane.clientWidth || 344,
          h: artPane.clientHeight || 560,
        };
      }
      let { w, h } = paneSize();

      // Scene
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x17171c); // matches --ink-3

      const torusGroup = new THREE.Group();
      scene.add(torusGroup);

      // Camera
      const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
      camera.position.z = 7;

      // Renderer
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(w, h, false);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      // Post-processing
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(w, h),
        0.75,
        0.4,
        0.65,
      );
      composer.addPass(bloomPass);
      const fxaaPass = new ShaderPass(FXAAShader);
      fxaaPass.uniforms["resolution"].value.set(1 / w, 1 / h);
      composer.addPass(fxaaPass);

      // Lights
      scene.add(new THREE.AmbientLight(0xffffff, 0.35));
      const dirLight = new THREE.DirectionalLight(0xfff4e0, 2.8);
      dirLight.position.set(3, 4, 5);
      scene.add(dirLight);
      const fillLight = new THREE.DirectionalLight(0xaabbff, 0.5);
      fillLight.position.set(-4, -2, -3);
      scene.add(fillLight);

      // Textures
      const loader = new THREE.TextureLoader();
      const diffuse = loader.load(
        "https://raw.githubusercontent.com/danielyl123/person/refs/heads/main/diffuse.jpg",
      );
      const normalTx = loader.load(
        "https://raw.githubusercontent.com/danielyl123/person/refs/heads/main/normal.jpg",
      );
      const arm = loader.load(
        "https://raw.githubusercontent.com/danielyl123/person/refs/heads/main/arm.jpg",
      );
      [diffuse, normalTx, arm].forEach((t) => {
        t.repeat.set(2, 2);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
      });
      diffuse.colorSpace = THREE.SRGBColorSpace;

      // ── Barycentric wireframe inner torus ──
      function addBarycentricCoords(geo) {
        const g = geo.toNonIndexed();
        const cnt = g.attributes.position.count;
        const bary = new Float32Array(cnt * 3);
        for (let i = 0; i < cnt; i += 3) {
          bary[i * 3] = 1;
          bary[i * 3 + 1] = 0;
          bary[i * 3 + 2] = 0;
          bary[(i + 1) * 3] = 0;
          bary[(i + 1) * 3 + 1] = 1;
          bary[(i + 1) * 3 + 2] = 0;
          bary[(i + 2) * 3] = 0;
          bary[(i + 2) * 3 + 1] = 0;
          bary[(i + 2) * 3 + 2] = 1;
        }
        g.setAttribute("barycentric", new THREE.BufferAttribute(bary, 3));
        return g;
      }

      const wireMat = new THREE.ShaderMaterial({
        vertexShader: /* glsl */ `
        attribute vec3 barycentric;
        varying vec3 vBary;
        void main() {
          vBary = barycentric;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        }
      `,
        fragmentShader: /* glsl */ `
        varying vec3 vBary;
        float wireMask(vec3 b,float t){
          vec3 d=fwidth(b);
          vec3 a=smoothstep(vec3(0.0),d*t,b);
          return 1.0-min(a.x,min(a.y,a.z));
        }
        void main(){
          float wf=wireMask(vBary,1.6);
          vec3 col=mix(vec3(0.07,0.01,0.0),vec3(1.0,0.28,0.04),wf);
          col=mix(col,vec3(1.0,0.8,0.3)*2.2,wf*0.55);
          gl_FragColor=vec4(col,1.0);
        }
      `,
        side: THREE.DoubleSide,
        extensions: { derivatives: true },
      });
      torusGroup.add(
        new THREE.Mesh(
          addBarycentricCoords(new THREE.TorusGeometry(2, 0.4, 80, 80)),
          wireMat,
        ),
      );

      // ── Voronoi fragments ──
      const FRAG_SCALE = 50,
        TORUS_R = 2,
        TORUS_r = 0.4;

      function hash2(px, py) {
        const a = Math.sin(px * 127.1 + py * 311.7) * 43758.5453;
        const b = Math.sin(px * 269.5 + py * 183.3) * 43758.5453;
        return [a - Math.floor(a), b - Math.floor(b)];
      }
      function cellSeed(u, v) {
        const n = [Math.floor(u * FRAG_SCALE), Math.floor(v * FRAG_SCALE)];
        const f = [u * FRAG_SCALE - n[0], v * FRAG_SCALE - n[1]];
        let md = Infinity,
          best = [...n];
        for (let j = -2; j <= 2; j++)
          for (let i = -2; i <= 2; i++) {
            const o = hash2(n[0] + i, n[1] + j);
            const r = [i + o[0] - f[0], j + o[1] - f[1]];
            const d = r[0] * r[0] + r[1] * r[1];
            if (d < md) {
              md = d;
              best = [n[0] + i + o[0], n[1] + j + o[1]];
            }
          }
        return [best[0] / FRAG_SCALE, best[1] / FRAG_SCALE];
      }

      const fragments = (() => {
        const baseGeo = new THREE.TorusGeometry(TORUS_R, TORUS_r, 100, 100);
        const ni = baseGeo.toNonIndexed();
        baseGeo.dispose();
        const pos = ni.attributes.position.array;
        const nrm = ni.attributes.normal.array;
        const uvD = ni.attributes.uv.array;
        const tris = pos.length / 9;

        const cellMap = new Map();
        for (let t = 0; t < tris; t++) {
          const uc = (uvD[t * 6] + uvD[t * 6 + 2] + uvD[t * 6 + 4]) / 3;
          const vc = (uvD[t * 6 + 1] + uvD[t * 6 + 3] + uvD[t * 6 + 5]) / 3;
          const s = cellSeed(uc, vc);
          const k = `${s[0].toFixed(9)}_${s[1].toFixed(9)}`;
          if (!cellMap.has(k)) cellMap.set(k, { s, t: [] });
          cellMap.get(k).t.push(t);
        }

        const mat = new THREE.MeshStandardMaterial({
          map: diffuse,
          normalMap: normalTx,
          roughnessMap: arm,
          roughness: 1.0,
          metalness: 0.0,
          side: THREE.DoubleSide,
        });

        const list = [];
        const TWO_PI = Math.PI * 2;

        for (const { s: seed, t: triList } of cellMap.values()) {
          if (!triList.length) continue;
          const vc = triList.length * 3;
          const pArr = new Float32Array(vc * 3),
            nArr = new Float32Array(vc * 3),
            uvArr = new Float32Array(vc * 2);
          let vi = 0;
          for (const tri of triList)
            for (let v = 0; v < 3; v++) {
              const sv = tri * 3 + v;
              pArr[vi * 3] = pos[sv * 3];
              pArr[vi * 3 + 1] = pos[sv * 3 + 1];
              pArr[vi * 3 + 2] = pos[sv * 3 + 2];
              nArr[vi * 3] = nrm[sv * 3];
              nArr[vi * 3 + 1] = nrm[sv * 3 + 1];
              nArr[vi * 3 + 2] = nrm[sv * 3 + 2];
              uvArr[vi * 2] = uvD[sv * 2];
              uvArr[vi * 2 + 1] = uvD[sv * 2 + 1];
              vi++;
            }

          const phi = seed[0] * TWO_PI,
            theta = seed[1] * TWO_PI;
          const cx = (TORUS_R + TORUS_r * Math.cos(theta)) * Math.cos(phi);
          const cy = (TORUS_R + TORUS_r * Math.cos(theta)) * Math.sin(phi);
          const cz = TORUS_r * Math.sin(theta);
          const cellCenter = new THREE.Vector3(cx, cy, cz);
          const majorPt = new THREE.Vector3(
            TORUS_R * Math.cos(phi),
            TORUS_R * Math.sin(phi),
            0,
          );
          const cellNormal = cellCenter.clone().sub(majorPt).normalize();

          const SHRINK = 0.96;
          for (let i = 0; i < pArr.length; i += 3) {
            pArr[i] = (pArr[i] - cx) * SHRINK;
            pArr[i + 1] = (pArr[i + 1] - cy) * SHRINK;
            pArr[i + 2] = (pArr[i + 2] - cz) * SHRINK;
          }

          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(pArr, 3));
          geo.setAttribute("normal", new THREE.BufferAttribute(nArr, 3));
          geo.setAttribute("uv", new THREE.BufferAttribute(uvArr, 2));

          const rnd = hash2(seed[0] * 137.53, seed[1] * 137.53);
          const up =
            Math.abs(cellNormal.z) < 0.9
              ? new THREE.Vector3(0, 0, 1)
              : new THREE.Vector3(0, 1, 0);
          const tang = new THREE.Vector3()
            .crossVectors(cellNormal, up)
            .normalize();
          const bitang = new THREE.Vector3().crossVectors(cellNormal, tang);
          const aa = rnd[0] * TWO_PI;
          const rotAxis = tang
            .clone()
            .multiplyScalar(Math.cos(aa))
            .addScaledVector(bitang, Math.sin(aa))
            .normalize();

          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.copy(cellCenter).addScaledVector(cellNormal, 0.015);
          mesh.userData = {
            cellCenter,
            cellNormal,
            rotAxis,
            maxAngle: 0.7 + rnd[1] * 0.9,
            lift: 0,
          };
          torusGroup.add(mesh);
          list.push(mesh);
        }
        ni.dispose();
        return list;
      })();

      // ── Invisible raycaster torus ──
      const rcMesh = new THREE.Mesh(
        new THREE.TorusGeometry(TORUS_R, TORUS_r, 80, 80),
        new THREE.MeshBasicMaterial({ visible: false }),
      );
      torusGroup.add(rcMesh);

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2(-999, -999);

      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      });
      canvas.addEventListener("mouseleave", () => mouse.set(-999, -999));

      // ── Tick ──
      const clock = new THREE.Clock();
      let lastT = 0;
      const hover = { point: new THREE.Vector3(), active: 0 };
      const _lh = new THREE.Vector3();
      const fp = {
        hoverRadius: 0.75,
        liftDist: 0.28,
        liftUp: 0.15,
        liftDown: 0.06,
      };

      function smoothstep(lo, hi, v) {
        const t = Math.max(0, Math.min(1, (v - lo) / (hi - lo)));
        return t * t * (3 - 2 * t);
      }

      // Gentle tilt
      torusGroup.rotation.x = 0.25;

      function tick() {
        requestAnimationFrame(tick);
        const elapsed = clock.getElapsedTime();
        const delta = elapsed - lastT;
        lastT = elapsed;

        // Idle slow rotation
        torusGroup.rotation.y += delta * ((Math.PI * 2) / 22);

        // Raycasting (only when pane is visible)
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObject(rcMesh);
        if (hits.length > 0) {
          torusGroup.worldToLocal(_lh.copy(hits[0].point));
          hover.point.copy(_lh);
          hover.active = Math.min(hover.active + delta * 5, 1);
        } else {
          hover.active = Math.max(hover.active - delta * 2.5, 0);
        }

        for (const frag of fragments) {
          const { cellCenter, cellNormal, rotAxis, maxAngle } = frag.userData;
          let target = 0;
          if (hover.active > 0.01) {
            const dist = cellCenter.distanceTo(hover.point);
            target = (1 - smoothstep(0.4, fp.hoverRadius, dist)) * hover.active;
          }
          const spd = target > frag.userData.lift ? fp.liftUp : fp.liftDown;
          frag.userData.lift = THREE.MathUtils.lerp(
            frag.userData.lift,
            target,
            spd,
          );
          const lift = frag.userData.lift;
          frag.position
            .copy(cellCenter)
            .addScaledVector(cellNormal, 0.015 + lift * fp.liftDist);
          frag.quaternion.setFromAxisAngle(rotAxis, lift * maxAngle);
        }

        composer.render();
      }
      tick();

      // ── Resize observer — art pane only ──
      new ResizeObserver(() => {
        const { w: nw, h: nh } = paneSize();
        if (nw < 10 || nh < 10) return;
        camera.aspect = nw / nh;
        camera.updateProjectionMatrix();
        renderer.setSize(nw, nh, false);
        composer.setSize(nw, nh);
        bloomPass.resolution.set(nw, nh);
        fxaaPass.uniforms["resolution"].value.set(1 / nw, 1 / nh);
      }).observe(artPane);
    </script>

    <!-- ══ CHAT ENGINE ══ -->
    <script>
      const overlay = document.getElementById("overlay");
      const fabBtn = document.getElementById("fabBtn");
      const closeBtn = document.getElementById("closeBtn");

      function openModal() {
        overlay.classList.add("open");
        fabBtn.classList.add("active");
        fabBtn.setAttribute("aria-expanded", "true");
        document.body.style.overflow = "hidden";
        if (!window._started) {
          window._started = true;
          setTimeout(startFlow, 380);
        }
      }
      function closeModal() {
        overlay.classList.remove("open");
        fabBtn.classList.remove("active");
        fabBtn.setAttribute("aria-expanded", "false");
        document.body.style.overflow = "";
      }

      fabBtn.addEventListener("click", () =>
        overlay.classList.contains("open") ? closeModal() : openModal(),
      );
      closeBtn.addEventListener("click", closeModal);
      overlay.addEventListener("click", (e) => {
        if (e.target === overlay) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      const feed = document.getElementById("feed");
      const input = document.getElementById("chatInput");
      const sendBtn = document.getElementById("sendBtn");
      const typing = document.getElementById("typing");

      let step = 0;
      const data = { name: "", email: "", projectType: "", budget: "" };
      const ts = () =>
        new Date().toLocaleTimeString("en", {
          hour: "2-digit",
          minute: "2-digit",
        });

      function scroll() {
        feed.scrollTop = feed.scrollHeight;
      }

      function botMsg(text, delay = 0) {
        return new Promise((res) => {
          typing.classList.add("show");
          feed.appendChild(typing);
          scroll();
          setTimeout(
            () => {
              typing.classList.remove("show");
              const row = Object.assign(document.createElement("div"), {
                className: "bot-row",
              });
              const av = document.createElement("div");
              av.className = "mini-av";
              av.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`;
              const msg = document.createElement("div");
              msg.className = "msg msg-bot";
              const bub = document.createElement("div");
              bub.className = "bubble";
              bub.textContent = text;
              const tim = document.createElement("div");
              tim.className = "msg-time";
              tim.textContent = ts();
              msg.append(bub, tim);
              row.append(av, msg);
              feed.appendChild(row);
              scroll();
              res();
            },
            delay + 520 + Math.min(text.length * 5, 850),
          );
        });
      }

      function userMsg(text) {
        const msg = document.createElement("div");
        msg.className = "msg msg-user";
        const bub = document.createElement("div");
        bub.className = "bubble";
        bub.textContent = text;
        const tim = document.createElement("div");
        tim.className = "msg-time";
        tim.textContent = ts();
        msg.append(bub, tim);
        feed.appendChild(msg);
        scroll();
      }

      function showChips(options, onPick) {
        const wrap = document.createElement("div");
        wrap.className = "chips";
        options.forEach((opt) => {
          const c = document.createElement("button");
          c.className = "chip";
          c.textContent = opt;
          c.addEventListener("click", () => {
            wrap
              .querySelectorAll(".chip")
              .forEach((x) => x.classList.add("used"));
            userMsg(opt);
            onPick(opt);
          });
          wrap.appendChild(c);
        });
        feed.appendChild(wrap);
        scroll();
      }

      function enable(ph) {
        input.disabled = false;
        sendBtn.disabled = false;
        if (ph) input.placeholder = ph;
        input.focus();
      }
      function disable() {
        input.disabled = true;
        sendBtn.disabled = true;
      }

      async function handle(val) {
        disable();
        userMsg(val);
        if (step === 0) {
          if (val.trim().length < 2) {
            await botMsg(
              "Could you share your name? Even a first name is fine 😊",
            );
            enable("Your name…");
            return;
          }
          data.name = val.trim();
          step = 1;
          await botMsg(
            `Great to meet you, ${data.name.split(" ")[0]}! 😊\n\nWhat kind of project are you working on?`,
          );
          showChips(
            [
              "Website / Landing Page",
              "Full-Stack Web App",
              "Mobile App UI",
              "E-Commerce Store",
              "Dashboard / SaaS",
              "Something else",
            ],
            async (sel) => {
              data.projectType = sel;
              step = 2;
              await botMsg("Got it! What's your rough budget range?");
              showChips(
                [
                  "< $500",
                  "$500 – $1,500",
                  "$1,500 – $5,000",
                  "$5,000+",
                  "Let's discuss",
                ],
                async (bud) => {
                  data.budget = bud;
                  step = 3;
                  await botMsg(
                    "Almost there! 🔥\n\nDrop your email and any extra details — I'll get back within 24 hours.",
                  );
                  enable("your@email.com — add details here…");
                },
              );
            },
          );
        } else if (step === 3) {
          const m = val.match(/\S+@\S+\.\S+/);
          if (!m) {
            await botMsg(
              "I'll need a valid email in there — something like you@example.com 📧",
            );
            enable("your@email.com — add details here…");
            return;
          }
          data.email = m[0];
          step = 4;
          await botMsg(
            `All set! 🎉\n\nI'll reach out to ${data.email} very soon. Looking forward to working together, ${data.name.split(" ")[0]}!`,
          );
          console.log("📬 Lead:", data);
        }
      }

      sendBtn.addEventListener("click", () => {
        const v = input.value.trim();
        if (!v) return;
        input.value = "";
        handle(v);
      });
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          const v = input.value.trim();
          if (!v) return;
          input.value = "";
          handle(v);
        }
      });

      async function startFlow() {
        await botMsg(
          "Hey there! 👋 I'm Vishal.\n\nWhat's your name so I know who I'm talking to?",
          200,
        );
        enable("Your full name…");
      }
    </script>
  </body>

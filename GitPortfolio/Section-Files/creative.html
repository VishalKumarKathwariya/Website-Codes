<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>creative Section</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Lottie Player Web Component -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.8/dist/lottie-player.js"></script>

  <style>
    /* ---------- RESET & BASE ---------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Premium black glassmorphism */
    .creative-wrap {
      width: 100%;
      background: #f0ede8;
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      backdrop-filter: blur(28px) saturate(1.4);
      padding: 1rem 2rem;
    }

    .creative-inner {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .creative-left {
      position: relative;
      z-index: 10;
      background: transparent;
      display: flex;
      flex-direction: column;
    }

    .creative-heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.4rem);
      font-weight: 900;
      line-height: 1.12;
      color: #0a0a0a;
      margin-bottom: 0.4rem;
    }

    .creative-heading .static {
      display: block;
    }

    .word-rotator {
      display: inline-block;
      position: relative;
      height: 1.15em;
      overflow: hidden;
      vertical-align: bottom;
    }

    .word-rotator-inner {
      display: flex;
      flex-direction: column;
      animation: slideWords 8s ease-in-out infinite;
    }

    .word-rotator-inner span {
      display: block;
      line-height: 1.15;
      background: #F55D00 ;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }

    @keyframes slideWords {
      0%   { transform: translateY(0%); }
      15%  { transform: translateY(0%); }
      25%  { transform: translateY(-25%); }
      40%  { transform: translateY(-25%); }
      50%  { transform: translateY(-50%); }
      65%  { transform: translateY(-50%); }
      75%  { transform: translateY(-75%); }
      90%  { transform: translateY(-75%); }
      100% { transform: translateY(0%); }
    }

    .creative-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1.4rem 0 1.6rem;
    }

    .divider-line {
      height: 1px;
      width: 52px;
      border-radius: 2px;
    }

    .divider-line.left  { background: linear-gradient(90deg, #F55D00 , transparent); }
    .divider-line.right { background: linear-gradient(90deg, transparent, #F55D00); }

    .divider-dots {
      display: flex;
      gap: 4px;
    }

    .divider-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #F55D00;
    }

    .divider-dots span:nth-child(1) { opacity: 1; }
    .divider-dots span:nth-child(2) { opacity: 0.5; }
    .divider-dots span:nth-child(3) { opacity: 0.22; }

    .creative-desc {
      font-size: 15px;
      line-height: 1.75;
      color: #0a0a0a;
      margin-bottom: 2rem;
      max-width: 100%;
      font-weight: 400;
    }

    .creative-btns {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }

    /* Single wide CTA button */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 15px 0;
      width: min(360px, 100%);
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      letter-spacing: 0.03em;
      color: #0a0a0a;
      border: 1px solid #0a0a0a;
      transition: all 0.3s ease;
    }

    .btn-primary svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      background-color: #F55D00;
    }

    .btn-primary:hover {
      border: 1px solid #F55D00;
        transform: translateY(-2px);
    }

    .btn-primary:active { transform: scale(0.97); }

    /* ---------- LOTTIE ---------- */
    .creative-right {
      display: none;
    }

    @media (max-width: 767px) {
      .creative-wrap {
        padding: 1.5rem;
      }
      .creative-inner {
        position: relative;
      }

      .creative-right {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
        pointer-events: none;
      }

      .lottie-stage {
        position: relative;
        width: 100%;
        max-width: 320px;
        margin: 0 auto;
        aspect-ratio: 1;
        top: 15%;
        transform: translateY(-5%);
        opacity: 0.55;
      }

      lottie-player {
        width: 100%;
        height: 100%;
      }
    }

    @media (min-width: 768px) {
      .creative-inner {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3rem;
        align-items: center;
      }

      .creative-right {
        display: flex;
        position: relative;
        pointer-events: auto;
        justify-content: center;
        align-items: center;
      }

      .creative-left {
        z-index: auto;
      }

      .lottie-stage {
        max-width: 420px;
        aspect-ratio: 1;
        margin: 0 auto;
      }

      .creative-desc {
        max-width: 420px;
      }
      .btn-primary{
        border: 1.5px solid #0a0a0a;
        transition: all 0.3s ease;
      }
      .btn-primary:hover {
        border: 1.5px solid #F55D00;
        transform: translateY(-2px);
      }
    }

    @media (min-width: 1024px) {
      .creative-inner {
        gap: 4rem;
      }
      .lottie-stage {
        max-width: 480px;
      }
      .creative-heading {
        font-size: clamp(2.8rem, 4vw, 3.6rem);
      }
    }
  </style>
</head>
<body>

<section class="creative-wrap">
  <div class="creative-inner">

    <div class="creative-left">
      <h1 class="creative-heading">
        <span class="static">Let's make something</span>
        <span class="word-rotator">
          <span class="word-rotator-inner">
            <span>Outstanding.</span>
            <span>Engaging.</span>
            <span>Innovative.</span>
            <span>Strategic.</span>
          </span>
        </span>
      </h1>

      <div class="creative-divider">
        <div class="divider-line left"></div>
        <div class="divider-dots">
          <span></span><span></span><span></span>
        </div>
        <div class="divider-line right"></div>
      </div>

      <p class="creative-desc">
        We craft experiences that captivate audiences and drive real results — from bold brands to seamless digital products.
      </p>

      <div class="creative-btns">
        <a href="#" class="btn-primary">
          <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 3a1 1 0 011-1h10a1 1 0 011 1v9a1 1 0 01-1 1H3a1 1 0 01-1-1V3z" stroke="white" stroke-width="1.3"/>
            <path d="M5 7h6M5 9.5h4" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          Get In Touch
        </a>
      </div>
    </div>

    <div class="creative-right">
      <div class="lottie-stage">
        <lottie-player
          src="/animation.json"
          background="transparent"
          speed="1"
          loop
          autoplay>
        </lottie-player>
      </div>
    </div>

  </div>
</section>

</body>
</html>

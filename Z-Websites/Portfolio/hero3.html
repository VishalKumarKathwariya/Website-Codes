<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unleash Your Sensuality</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #f5f5f5;
        }

        /* Main Hero Container */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #f5f5f5;
            overflow: hidden;
        }

        /* Background Pink Blobs - z-index: 1-2 */
        .pink-blob-left {
            position: absolute;
            top: 24%;
            left: 25%;
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #b25ab2 0%, #ec87ec 100%);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.6;
        }

        .pink-blob-right {
            position: absolute;
            top: 12%;
            right: -12%;
            width: 250px;
            height: 250px;
            background: linear-gradient(135deg, #ce7dce 0%, #eb21eb 100%);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.6;
        }

        .pink-blob-bottom-left {
            position: absolute;
            bottom: 5%;
            left: 15%;
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #a759a7 0%, #d98fd9 100%);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.6;
        }

        /* Typography Layer - z-index: 5 */
        .text-unleash {
            position: absolute;
            top: 16%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 80px;
            font-family: 'Georgia', serif;
            font-weight: 400;
            color: #1a1a1a;
            z-index: 5;
            white-space: nowrap;
        }

        .text-your {
            position: absolute;
            top: 37%;
            left: 29.5%;
            font-size: 1.2rem;
            font-weight: 700;
            color: #333;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 5;
        }

        .text-sensuality {
            position: absolute;
            bottom: 34%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 120px;
            font-family: 'Georgia', serif;
            font-weight: 500;
            color: #1a1a1a;
            letter-spacing: 4px;
            z-index: 5;
            white-space: nowrap;
        }

        /* Center Portrait Image - z-index: 10 (ON TOP OF TEXT) */
        .center-portrait {
            position: absolute;
            bottom: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 600px;
            z-index: 10;
        }

        .center-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* filter: grayscale(100%) contrast(1.1); */
        }

        /* Left Content Block - z-index: 6 */
        .content-block {
            position: absolute;
            bottom: 8%;
            left: 10%;
            width: 300px;
            z-index: 6;
        }

        .content-heading {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .content-paragraph {
            font-size: 13px;
            font-weight: 400;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .cta-ready {
            position: relative;
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            padding-bottom: 6px;
            transition: all 0.3s ease;
        }

        .cta-ready::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1a1a1a;
        }

        .cta-ready::before {
            content: '→';
            margin-left: 8px;
            font-size: 14px;
        }

        .cta-ready:hover {
            transform: translateX(5px);
        }

        /* Bottom Right Navigation - z-index: 8 */
        .nav-arrows {
            position: absolute;
            bottom: 8%;
            right: 20%;
            display: flex;
            gap: 30px;
            z-index: 8;
        }

        .arrow {
            font-size: 18px;
            color: #333;
            cursor: pointer;
            transition: transform 0.3s ease;
            font-weight: 300;
        }

        .arrow:hover {
            transform: scale(1.2);
        }

        .counter {
            position: absolute;
            bottom: 5%;
            right: 5%;
            font-size: 90px;
            font-weight: 700;
            color: #1a1a1a;
            font-family: 'Georgia', serif;
            z-index: 8;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        
        <!-- Background Pink Blobs -->
        <div class="pink-blob-left"></div>
        <div class="pink-blob-right"></div>
        <div class="pink-blob-bottom-left"></div>

        <!-- Typography Layer -->
        <div class="text-unleash">UNLEASH</div>
        <div class="text-your">YOUR</div>
        <div class="text-sensuality">SENSUALITY</div>

        <!-- Center Portrait Image (ON TOP OF TEXT) -->
        <div class="center-portrait">
            <img src="/YouTubeContent/CardDesign1/Black.png" alt="Sensuality Portrait">
        </div>

        <!-- Left Content Block -->
        <div class="content-block">
            <div class="content-heading">Tantra for beginners</div>
            <div class="content-paragraph">
                Ut vero ipsum sapien, interdum et malesuada fames ac ante. Ipsum primis in faucibus. Integer eget risus egestas dictumque.
            </div>
            <div class="cta-ready">ARE YOU READY?</div>
        </div>

        <!-- Bottom Right Navigation -->
        <div class="nav-arrows">
            <span class="arrow">‹</span>
            <span class="arrow">›</span>
        </div>

        <div class="counter">*03</div>


    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unleash Your Sensuality</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #f5f5f5;
        }

        /* Main Hero Container */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #f5f5f5;
            overflow: hidden;
        }

        /* Background Pink Blobs - z-index: 1-2 */
        .pink-blob-left {
            position: absolute;
            top: 15%;
            left: 5%;
            width: 380px;
            height: 380px;
            background: linear-gradient(135deg, #f0d5f0 0%, #f8e5f8 100%);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.6;
        }

        .pink-blob-right {
            position: absolute;
            top: 12%;
            right: -5%;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #e8d5e8 0%, #f5e5f5 100%);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.6;
        }

        .pink-blob-bottom-left {
            position: absolute;
            bottom: 10%;
            left: -5%;
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, #f0d5f0 0%, #f8e5f8 100%);
            border-radius: 50%;
            z-index: 1;
            opacity: 0.6;
        }

        /* Typography Layer - z-index: 5 */
        .text-unleash {
            position: absolute;
            top: 18%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 100px;
            font-family: 'Georgia', serif;
            font-weight: 400;
            color: #1a1a1a;
            letter-spacing: 8px;
            z-index: 5;
            white-space: nowrap;
        }

        .text-your {
            position: absolute;
            top: 25%;
            left: 25%;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            letter-spacing: 4px;
            text-transform: uppercase;
            z-index: 5;
        }

        .text-sensuality {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 130px;
            font-family: 'Georgia', serif;
            font-weight: 400;
            color: #1a1a1a;
            letter-spacing: 12px;
            z-index: 5;
            white-space: nowrap;
        }

        /* Center Portrait Image - z-index: 10 (ON TOP OF TEXT) */
        .center-portrait {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 320px;
            z-index: 10;
        }

        .center-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1);
        }

        /* Left Content Block - z-index: 6 */
        .content-block {
            position: absolute;
            top: 55%;
            left: 8%;
            width: 300px;
            z-index: 6;
        }

        .content-heading {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .content-paragraph {
            font-size: 13px;
            font-weight: 400;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .cta-ready {
            position: relative;
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            padding-bottom: 6px;
            transition: all 0.3s ease;
        }

        .cta-ready::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #1a1a1a;
        }

        .cta-ready::before {
            content: '→';
            margin-left: 8px;
            font-size: 14px;
        }

        .cta-ready:hover {
            transform: translateX(5px);
        }

        /* Bottom Right Small Image - z-index: 6 */
        .small-accessory {
            position: absolute;
            top: 60%;
            left: 55%;
            width: 140px;
            height: 140px;
            z-index: 6;
        }

        .small-accessory img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1);
        }

        /* Bottom Right Navigation - z-index: 8 */
        .nav-arrows {
            position: absolute;
            bottom: 40%;
            right: 20%;
            display: flex;
            gap: 30px;
            z-index: 8;
        }

        .arrow {
            font-size: 18px;
            color: #333;
            cursor: pointer;
            transition: transform 0.3s ease;
            font-weight: 300;
        }

        .arrow:hover {
            transform: scale(1.2);
        }

        .counter {
            position: absolute;
            bottom: 37%;
            right: 8%;
            font-size: 90px;
            font-weight: 700;
            color: #1a1a1a;
            font-family: 'Georgia', serif;
            z-index: 8;
        }

        .bottom-indicators {
            position: absolute;
            bottom: 35%;
            right: 10%;
            display: flex;
            gap: 25px;
            z-index: 8;
        }

        .indicator {
            font-size: 11px;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        
        <!-- Background Pink Blobs -->
        <div class="pink-blob-left"></div>
        <div class="pink-blob-right"></div>
        <div class="pink-blob-bottom-left"></div>

        <!-- Typography Layer -->
        <div class="text-unleash">UNLEASH</div>
        <div class="text-your">YOUR</div>
        <div class="text-sensuality">SENSUALITY</div>

        <!-- Center Portrait Image (ON TOP OF TEXT) -->
        <div class="center-portrait">
            <img src="" alt="Sensuality Portrait">
        </div>

        <!-- Left Content Block -->
        <div class="content-block">
            <div class="content-heading">Tantra for beginners</div>
            <div class="content-paragraph">
                Ut vero ipsum sapien, interdum et malesuada fames ac ante. Ipsum primis in faucibus. Integer eget risus egestas dictumque.
            </div>
            <div class="cta-ready">ARE YOU READY?</div>
        </div>

        <!-- Bottom Right Small Accessory Image -->
        <div class="small-accessory">
            <img src="" alt="Fashion Accessory">
        </div>

        <!-- Bottom Right Navigation -->
        <div class="nav-arrows">
            <span class="arrow">‹</span>
            <span class="arrow">›</span>
        </div>

        <div class="counter">*03</div>

        <div class="bottom-indicators">
            <span class="indicator">Tue</span>
            <span class="indicator">Fri</span>
            <span class="indicator">Why</span>
        </div>

    </div>
</body>
</html>

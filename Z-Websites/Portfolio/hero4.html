<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lookbook - Season 020</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            overflow: hidden;
            background: #e8e8e8;
        }

        /* Main Container */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #f9f6f4;
            overflow: hidden;
        }

        /* Main Heading */
        .main-heading {
            position: absolute;
            top: 18%;
            left: 10%;
            font-size: 72px;
            font-weight: 400;
            color: #1a1a1a;
            letter-spacing: 2px;
            line-height: 1.1;
            z-index: 5;
            max-width: 700px;
        }

        .heading-season {
           position: absolute;
            top: 28%;
            left: 30%;
            font-size: 72px;
            font-weight: 400;
            color: #1a1a1a;
            letter-spacing: 2px;
            line-height: 1.1;
            z-index: 5;
            max-width: 600px;
        }

        /* Left Portrait Image */
        .left-portrait {
            position: absolute;
            top: 35%;
            left: 10%;
            width: 240px;
            height: 200px;
            background: #1a1a1a;
            z-index: 3;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .left-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.15);
        }

        /* Center Portrait Image */
        .center-portrait {
            position: absolute;
            top: 65%;
            left: 26%;
            transform: translateY(-50%);
            width: 360px;
            height: 200px;
            background: #1a1a1a;
            z-index: 4;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        .center-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.15);
        }

        /* Pink Accent Element */
        .pink-accent {
            position: absolute;
            top: 23%;
            left: 13%;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: linear-gradient(135deg, #df84c5 0%, #f5a4e1 100%);
            z-index: 2;
            opacity: 0.85;
        }

        /* Right Side Content Box */
        .pink-accent-right{
            position: absolute;
            bottom: 24%;
            right: 27%;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d85bb5 0%, #dca8cf 100%);
            z-index: 2;
            opacity: 0.85;
        }
        .right-content {
            position: absolute;
            top: 50%;
            right: 12%;
            width: 320px;
            z-index: 6;
        }

        .content-title {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
            font-family: 'Arial', sans-serif;
            letter-spacing: 0.5px;
        }

        .content-description {
            font-size: 12px;
            font-weight: 400;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            font-family: 'Arial', sans-serif;
        }

        .cta-link {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            color: #1a1a1a;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 2px;
            font-family: 'Arial', sans-serif;
        }

        /* Bottom Right Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 8%;
            right: 24%;
            display: flex;
            align-items: center;
            gap: 35px;
            z-index: 8;
        }

        .nav-arrows {
            display: flex;
            gap: 25px;
        }

        .arrow {
            font-size: 20px;
            color: #333;
            cursor: pointer;
            transition: transform 0.3s ease;
            font-weight: 300;
        }

        .arrow:hover {
            transform: scale(1.2);
        }

        /* Counter */
        .counter {
            position: absolute;
            bottom: 5%;
            right: 5%;
            font-size: 90px;
            font-weight: 700;
            color: #1a1a1a;
            font-family: 'Georgia', serif;
            z-index: 8;
            letter-spacing: -2px;
        }

    </style>
</head>
<body>
    <div class="hero-section">
        

        <!-- Main Heading -->
        <div class="main-heading">
            THE LOOKBOOK
        </div>
        <div class="heading-season">SEASON 020</div>
        

        <!-- Pink Accent (Behind Images) -->
        <div class="pink-accent"></div>

        <!-- Left Portrait Image -->
        <div class="left-portrait">
            <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400&h=360&fit=crop" alt="Fashion Portrait Left">
        </div>

        <!-- Center Portrait Image -->
        <div class="center-portrait">
            <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=600&h=480&fit=crop" alt="Fashion Portrait Center">
        </div>

        <!-- Right Side Content -->
         <div class="pink-accent-right"></div>
        <div class="right-content">
            <div class="content-title">Some of the best suggestions<br>from the last collections</div>
            
            <div class="content-description">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Etiam in ex sagittis, posuere enim in, suscipit ligula. Donec iaculis a massa quis ultrices.
            </div>
            
            <a href="#" class="cta-link">CHECK THIS</a>
        </div>

        <!-- Bottom Navigation Arrows -->
        <div class="bottom-nav">
            <div class="nav-arrows">
                <span class="arrow">‹</span>
                <span class="arrow">›</span>
            </div>
        </div>

        <!-- Counter -->
        <div class="counter">*06</div>

    </div>
</body>
</html>

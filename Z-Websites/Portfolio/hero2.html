<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editorial - Week in Fashion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #f5f5f5;
        }

        /* Main Hero Container */
        .hero-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #f5f5f5;
            overflow: hidden;
        }

        /* Top Left - Divider Line - z-index: 5 */
        .divider-line {
            position: absolute;
            bottom: 59%;
            left: 10%;
            width: 50px;
            height: 2px;
            background: #1a1a1a;
            z-index: 5;
        }

        /* Top Left - "WEEK IN FASHION" Heading - z-index: 5 */
        .heading-week {
            position: absolute;
            bottom: 54%;
            left: 10%;
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 5;
        }

        /* Top Left - Paragraph Text - z-index: 5 */
        .paragraph-text {
            position: absolute;
            bottom: 42%;
            left: 10%;
            width: 280px;
            font-size: 13px;
            font-weight: 400;
            color: #666;
            line-height: 1;
            z-index: 5;
        }

        /* Upper Left - First Portrait Image - z-index: 3 */
        .upper-left-portrait {
            position: absolute;
            background: #1a1a1a;
            bottom: 8%;
            left: 10%;
            width: 280px;
            height: 180px;
            z-index: 3;
        }

        .upper-left-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1);
        }

        /* Center - Pink Square/Rectangle - z-index: 2 */
        .pink-square {
            position: absolute;
            top: 45%;
            left: 42%;
            width: 440px;
            height: 200px;
            background: linear-gradient(135deg, #d67ed6 0%, #e1b2e1 100%);
            z-index: 2;
            opacity: 0.7;
        }

        /* Center Left - Vertical "EDIT" Text - z-index: 10 */
        .edit-text {
            position: absolute;
            bottom: 40%;
            left: 40%;
            transform: rotate(-90deg) translate(-50%, 0);
            transform-origin: center center;
            font-size: 100px;
            font-family: 'Georgia', serif;
            font-weight: 400;
            color: #1a1a1a;
            letter-spacing: 4px;
            z-index: 10;
            white-space: nowrap;
        }

        /* Center Right - Vertical "ORIAL" Text - z-index: 10 */
        .orial-text {
            position: absolute;
            top: 0%;
            left: 44%;
            transform: rotate(-90deg) translate(-50%, 0);
            transform-origin: center center;
            font-size: 100px;
            font-family: 'Georgia', serif;
            font-weight: 400;
            color: #1a1a1a;
            letter-spacing: 4px;
            z-index: 10;
            white-space: nowrap;
        }

        /* Top Right - Large Portrait Image - z-index: 3 */
        .large-portrait {
            background: #1a1a1a;
            position: absolute;
            top: 15%;
            right: 10%;
            width: 260px;
            height: 350px;
            z-index: 3;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .large-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1);
        }

        /* Bottom Right - Navigation Arrows - z-index: 8 */
        .nav-arrows {
            position: absolute;
            bottom: 10%;
            right: 22%;
            display: flex;
            gap: 30px;
            z-index: 8;
        }

        .arrow {
            font-size: 18px;
            color: #333;
            cursor: pointer;
            transition: transform 0.3s ease;
            font-weight: 300;
        }

        .arrow:hover {
            transform: scale(1.2);
        }

        /* Bottom Right - "*02" Counter - z-index: 8 */
        .counter {
            position: absolute;
            bottom: 5%;
            right: 8%;
            font-size: 80px;
            font-weight: 700;
            color: #1a1a1a;
            font-family: 'Georgia', serif;
            z-index: 8;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        
        <!-- Top Left Section -->
        <div class="divider-line"></div>
        
        <div class="heading-week">WEEK IN FASHION</div>
        
        <div class="paragraph-text">
            Iste pariatur proponent Musa adiumento in lingua Latina nunc etiam facta at ficta, non solum varius mulieque conuenit, sed etiam disputare distinguere.
        </div>

        <!-- Upper Left - First Portrait -->
        <div class="upper-left-portrait">
            <img src="" alt="Fashion Portrait Upper">
        </div>

        <!-- Center - Pink Square (Behind EDITORIAL) -->
        <div class="pink-square"></div>

        <!-- Center - Vertical EDIT Text -->
        <div class="edit-text">EDIT</div>

        <!-- Center - Vertical ORIAL Text -->
        <div class="orial-text">ORIAL</div>

        <!-- Top Right - Large Portrait -->
        <div class="large-portrait">
            <img src="" alt="Fashion Portrait Large">
        </div>

        <!-- Bottom Right - Navigation Elements -->
        <div class="nav-arrows">
            <span class="arrow">‹</span>
            <span class="arrow">›</span>
        </div>

        <div class="counter">*02</div>

    </div>
</body>
</html>
